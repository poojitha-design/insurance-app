<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Intel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111111'/%3E%3Cpath d='M8 22V10l8-4 8 4v12l-8 4-8-4z' fill='%232EDB8E'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-muted: #f3f7f5;
  --border: #e2e8e5;
  --border-strong: #c5d0cb;
  --text: #1a1a1a;
  --text-secondary: #4b5560;
  --text-muted: #6b7780;
  --navy: #111111;
  --navy-deep: #111111;
  --navy-soft: #e8fbf3;
  --header: #111111;
  --header-text: #ffffff;
  --header-muted: #b8c0bc;
  --accent: #2edb8e;
  --accent-hover: #25c47d;
  --accent-text: #0b1f18;
  --mint: #2edb8e;
  --mint-soft: #e8fbf3;
  --green: #13be2e;
  --green-bg: #ecfdf3;
  --green-border: #bbf7d0;
  --amber: #ffc33d;
  --amber-bg: #fffbeb;
  --amber-border: #fde68a;
  --red: #f24456;
  --red-bg: #fef2f2;
  --red-border: #fecaca;
  --urgent: #f24456;
  --shadow: 0 1px 2px rgba(17, 17, 17, 0.04), 0 8px 24px rgba(17, 17, 17, 0.06);
  --radius: 8px;
  --radius-sm: 6px;
  --font: "Poppins", system-ui, sans-serif;
  --mono: "Poppins", system-ui, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

button,
input,
select {
  font: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

#app {
  min-height: 100vh;
}

/* ---------- Login ---------- */
.login-page {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #111;
}

.login-hero {
  position: absolute;
  inset: 0 0 36px;
  z-index: 0;
}

.login-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 28% 42%;
  display: block;
}

.login-stage {
  position: relative;
  z-index: 1;
  flex: 1;
  display: grid;
  grid-template-columns: minmax(24px, 1fr) minmax(360px, 460px) minmax(24px, 0.22fr);
  align-items: center;
  min-width: 0;
  padding: 40px 0 56px;
}

.login-card {
  grid-column: 2;
  width: 100%;
  min-width: 0;
  background: var(--surface);
  border-radius: 20px;
  box-shadow: 0 24px 60px rgba(17, 17, 17, 0.22);
  padding: 32px 28px 24px;
}

.login-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 28px;
}

.login-company {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--navy);
}

.login-company .azentio-logo {
  height: 32px;
  width: auto;
}

.login-company-name {
  display: flex;
  flex-direction: column;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 0.68rem;
  line-height: 1.15;
  padding-left: 12px;
  border-left: 1px solid var(--border-strong);
}

.login-az-mark {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  color: #2edb8e;
}

.login-az-mark svg {
  width: 34px;
  height: 34px;
  display: block;
}

.login-card h1 {
  margin: 0 0 22px;
  font-size: 1.65rem;
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: -0.02em;
  color: var(--navy);
}

.login-card h1 span {
  font-weight: 700;
}

.login-input {
  position: relative;
  display: block;
  margin-bottom: 14px;
}

.login-input input {
  width: 100%;
  height: 48px;
  padding: 0 44px 0 44px;
  border: 1px solid #d5d9dc;
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  outline: none;
}

.login-input input::placeholder {
  color: #8b949a;
}

.login-input input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(46, 219, 142, 0.18);
}

.login-input-icon,
.login-eye {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: #8b949a;
  display: grid;
  place-items: center;
}

.login-input-icon {
  left: 14px;
  pointer-events: none;
}

.login-eye {
  right: 10px;
  width: 32px;
  height: 32px;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.login-forgot {
  display: inline-block;
  margin: 2px 0 16px;
  padding: 0;
  border: 0;
  background: none;
  color: #2edb8e;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
}

.login-forgot:hover {
  text-decoration: underline;
}

.login-keep {
  margin: 0 0 18px;
}

.btn-login {
  background: #16303d;
  color: #fff;
  height: 48px;
  border-radius: 8px;
  font-size: 0.95rem;
}

.btn-login:hover:not(:disabled) {
  background: #0f222b;
  color: #fff;
}

.login-sso-link {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 0;
  border: 0;
  background: none;
  color: #2edb8e;
  font-size: 0.9rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
}

.login-sso-link:hover {
  text-decoration: underline;
}

.login-demo {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

.login-demo-label {
  margin: 0 0 10px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.login-demo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.login-demo-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
}

.login-demo-chip:hover {
  border-color: var(--accent);
  background: var(--mint-soft);
}

.login-demo-chip .persona-avatar {
  width: 28px;
  height: 28px;
  font-size: 0.7rem;
}

.login-demo-chip strong {
  display: block;
  font-size: 0.78rem;
  color: var(--navy);
}

.login-demo-chip small {
  color: var(--text-muted);
  font-size: 0.7rem;
}

.login-footer {
  position: relative;
  z-index: 1;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 28px;
  background: #16303d;
  color: #d7e0e3;
  font-size: 0.75rem;
}

@media (max-width: 860px) {
  .login-hero {
    inset: 0 0 36px;
    filter: brightness(0.78);
  }

  .login-stage {
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }

  .login-card {
    padding: 28px 22px 22px;
  }

  .login-card h1 {
    font-size: 1.35rem;
  }
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.azentio-logo {
  display: block;
  height: 32px;
  width: auto;
  object-fit: contain;
  filter: none;
}

.brand-divider {
  width: 1px;
  height: 22px;
  background: var(--border-strong);
  flex-shrink: 0;
}

.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(145deg, #5fffbe 0%, #3aefad 100%);
  display: grid;
  place-items: center;
  color: var(--accent-text);
  flex-shrink: 0;
}

.brand-icon svg {
  width: 22px;
  height: 22px;
}

.brand-name {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.login-helper {
  margin: 0 0 28px;
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.45;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.field input[type="text"],
.field input[type="password"],
.field input[type="number"] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(46, 219, 142, 0.22);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 18px 0 22px;
  font-size: 0.875rem;
  color: var(--text-secondary);
}

.checkbox-row input {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  color: var(--accent-text);
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
  color: var(--accent-text);
}

.btn-secondary {
  background: var(--surface);
  border-color: var(--border-strong);
  color: var(--text);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--surface-muted);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border-color: transparent;
}

.btn-ghost:hover:not(:disabled) {
  background: var(--navy-soft);
  color: var(--navy);
}

.btn-block {
  width: 100%;
}

.btn-sm {
  padding: 6px 10px;
  font-size: 0.75rem;
  gap: 4px;
}

.btn-ink {
  background: #16303d;
  color: #fff;
  border-color: #16303d;
}

.btn-export {
  background: #16303d;
  color: var(--mint);
  border-color: #16303d;
}

.btn-export:hover:not(:disabled) {
  background: #111;
  border-color: #111;
  color: var(--mint);
}

.btn-export svg {
  transition: transform 0.15s;
}

.export-menu.is-open .btn-export svg {
  transform: rotate(180deg);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.login-error {
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  color: var(--red);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  margin-bottom: 14px;
}

.demo-accounts {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

.demo-accounts h3 {
  margin: 0 0 10px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

.demo-list {
  display: grid;
  gap: 8px;
}

.demo-chip {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}

.demo-chip:hover,
.demo-chip.is-selected {
  border-color: var(--accent);
  background: var(--mint-soft);
  box-shadow: 0 0 0 3px rgba(46, 219, 142, 0.12);
}

.demo-chip .persona-avatar {
  width: 40px;
  height: 40px;
  font-size: 0.75rem;
}

.demo-chip .demo-copy {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.demo-chip .role {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--navy);
}

.demo-chip .blurb {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.demo-chip .enter {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--accent-text);
  background: var(--accent);
  border-radius: 999px;
  padding: 6px 10px;
  white-space: nowrap;
}

/* ---------- App shell ---------- */
.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  background: var(--bg);
  color: #16303d;
  border-bottom: none;
  padding: 8px 24px;
  height: 64px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 24px;
  min-width: 0;
  justify-self: start;
}

.topbar .brand-mark {
  margin: 0;
}

.topbar .azentio-logo {
  height: 26px;
  width: auto;
  object-fit: contain;
}

.nav-capsule {
  justify-self: center;
  display: flex;
  align-items: center;
  gap: 2px;
  height: 48px;
  padding: 3.5px 8px;
  border-radius: 24px;
  background:
    linear-gradient(0deg, rgba(195, 241, 221, 0.3), rgba(195, 241, 221, 0.3)),
    rgba(255, 255, 255, 0.55);
}

.nav-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 41px;
  padding: 0 14px;
  border-radius: 20.5px;
  font-size: 0.875rem;
  font-weight: 500;
  color: #16303d;
  white-space: nowrap;
  text-decoration: none;
}

.nav-link .nav-ico {
  display: grid;
  place-items: center;
  color: #2ed88e;
  flex-shrink: 0;
}

.nav-link:hover {
  background: rgba(255, 255, 255, 0.55);
  color: #16303d;
  text-decoration: none;
}

.nav-link.active {
  background: #fff;
  color: #16303d;
  font-weight: 500;
  box-shadow: 0 1px 3px rgba(22, 48, 61, 0.08);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-self: end;
}

.topbar-date {
  font-size: 0.8125rem;
  font-weight: 500;
  color: #7b959c;
  white-space: nowrap;
  padding-right: 4px;
}

.topbar-icon-btn {
  position: relative;
  width: 32px;
  height: 32px;
  border: 0;
  background: transparent;
  color: #16303d;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
  flex-shrink: 0;
}

.topbar-icon-btn:hover {
  color: #0f2430;
}

.topbar-badge {
  position: absolute;
  top: 1px;
  right: -2px;
  min-width: 15px;
  height: 15px;
  padding: 0 3px;
  border-radius: 8px;
  background: #55ffbe;
  color: #16303d;
  font-size: 8px;
  font-weight: 700;
  line-height: 15px;
  text-align: center;
}

.topbar-lang {
  border: 0;
  background: transparent;
  color: #16303d;
  font: inherit;
  font-size: 0.875rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 0 2px;
}

.persona-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: #16303d;
  cursor: pointer;
  font: inherit;
}

.persona-badge:hover,
.persona-wrap.is-open .persona-badge {
  background: transparent;
}

.persona-avatar {
  width: 33px;
  height: 33px;
  border-radius: 50%;
  background: #d4ffef;
  color: #16303d;
  border: 1.5px solid #2ed88e;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.persona-avatar svg {
  margin-top: 4px;
}

.persona-meta {
  display: none;
}

.persona-meta .name {
  font-size: 0.8rem;
  font-weight: 600;
}

.persona-meta .role {
  font-size: 0.7rem;
  color: var(--header-muted);
}

.persona-wrap {
  position: relative;
}

.persona-menu {
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  width: 240px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 8px;
  z-index: 60;
}

.persona-menu[hidden] {
  display: none;
}

.persona-menu-identity {
  padding: 8px 10px 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
}

.persona-menu-identity strong {
  display: block;
  font-size: 0.875rem;
}

.persona-menu-identity small {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.persona-menu button {
  width: 100%;
  justify-content: flex-start;
}

.workbench-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: -4px 0 16px;
}

.workbench-chip {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 16px 16px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.workbench-chip .value {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--navy-deep);
}

.workbench-chip a {
  font-size: 0.8125rem;
  font-weight: 600;
  color: #16303d;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.workbench-chip a:hover {
  color: var(--navy);
}

.workbench-chip.is-alert {
  border-color: #f9c5cb;
  background: var(--red-bg);
}

.workbench-chip.is-active {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

@media (max-width: 980px) {
  .workbench-strip {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 560px) {
  .workbench-strip {
    grid-template-columns: 1fr;
  }
}

.main {
  flex: 1;
  padding: 28px 24px 48px;
  max-width: 1180px;
  width: 100%;
  margin: 0 auto;
}

.main.is-listing {
  max-width: 1400px;
  padding-top: 20px;
}

.main.is-dashboard,
.main.is-claim {
  max-width: 1360px;
  padding-top: 20px;
}

/* ---------- Claims listing ---------- */
.listing-crumb {
  display: none;
}

.listing-crumb a {
  color: #1a56a0;
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.listing-crumb a:hover {
  color: #16303d;
}

.listing-page {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.listing-sheet {
  background: var(--surface);
  border-radius: 20px;
  padding: 20px 20px 12px;
  min-width: 0;
  box-shadow: 0 1px 2px rgba(17, 17, 17, 0.03);
}

.listing-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 14px;
}

.listing-head h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #1b2430;
}

.listing-count {
  margin: 0;
  font-size: 0.8125rem;
  color: var(--text-muted);
}

.listing-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.listing-search-form {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

.listing-search {
  position: relative;
  flex: 1 1 240px;
  min-width: 200px;
  max-width: 360px;
}

.listing-search-form .listing-search {
  width: 420px;
  flex: 0 0 420px;
  max-width: 420px;
  min-width: 240px;
}

.listing-search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  display: grid;
  pointer-events: none;
}

.listing-search input {
  width: 100%;
  height: 40px;
  padding: 8px 12px 8px 38px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
}

.listing-search-form .listing-search input {
  height: 30px;
  border-radius: 999px;
  border-color: #d7dde3;
  font-size: 0.8125rem;
}

.listing-search input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(46, 219, 142, 0.22);
}

.listing-search-go {
  height: 30px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font: inherit;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.listing-search-go:hover {
  color: var(--accent-hover);
}

.listing-chips {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  flex: 1 1 180px;
  min-width: 0;
}

.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 8px 0 10px;
  border: 1px solid var(--accent);
  border-radius: 999px;
  background: #fff;
  color: #2a3b34;
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
}

.filter-chip:hover {
  background: var(--mint-soft);
}

.filter-chip-x {
  color: var(--accent);
  font-size: 0.95rem;
  line-height: 1;
}

.listing-clear-all {
  height: 26px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font: inherit;
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
}

.listing-clear-all:hover {
  color: var(--accent-hover);
}

.listing-toolbar-end {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  flex-wrap: wrap;
}

.listing-mini-select {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.listing-mini-select select {
  appearance: none;
  height: 30px;
  padding: 0 28px 0 12px;
  border: 1px solid #d7dde3;
  border-radius: 8px;
  background: #fff;
  color: #4b5560;
  font: inherit;
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
}

.listing-mini-select svg {
  position: absolute;
  right: 8px;
  pointer-events: none;
  color: #6b7780;
}

.listing-custom-dates {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: -4px 0 12px;
  flex-wrap: wrap;
}

.listing-custom-dates label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem;
  color: var(--text-muted);
}

.listing-custom-dates input {
  height: 30px;
  border: 1px solid #d7dde3;
  border-radius: 8px;
  padding: 0 8px;
  font: inherit;
}

.listing-table-wrap {
  overflow-x: auto;
  border: 1px solid #edf0f2;
  border-radius: 10px;
}

.listing-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1080px;
}

.listing-table th,
.listing-table td {
  padding: 0 12px;
  height: 40px;
  text-align: left;
  vertical-align: middle;
  border-bottom: 1px solid #f0f2f4;
  font-size: 0.8125rem;
  color: #2b3540;
}

.listing-table thead th {
  height: 32px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  color: #5b6570;
  background: #eef1f3;
  white-space: nowrap;
}

.listing-table thead th:first-child {
  border-top-left-radius: 10px;
}

.listing-table thead th:last-child {
  border-top-right-radius: 10px;
}

.listing-table tbody tr.listing-row:hover {
  background: #fbfcfd;
}

.listing-table tbody tr.listing-row.is-open {
  background: #f7fbf9;
}

.listing-table tbody tr:last-child td {
  border-bottom: 0;
}

.listing-table .col-expand {
  width: 36px;
  padding-left: 8px;
  padding-right: 0;
}

.listing-table .col-score {
  white-space: nowrap;
}

.listing-table .col-num,
.listing-table .col-amount {
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.listing-table .col-deadline {
  white-space: nowrap;
  color: #3a4550;
}

.listing-table .col-deadline.is-overdue {
  color: var(--red);
  font-weight: 600;
}

.listing-link {
  color: #1a4f9c;
  font-weight: 500;
  font-size: 0.8125rem;
  white-space: nowrap;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}

.listing-link:hover {
  color: #16303d;
}

.claimant-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.expand-btn {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #8a949c;
  cursor: pointer;
}

.expand-btn:hover,
.expand-btn.is-open {
  background: #eef6f2;
  color: var(--navy-deep);
}

.expand-btn svg {
  transition: transform 0.15s ease;
}

.expand-btn.is-open svg {
  transform: rotate(180deg);
}

.listing-empty {
  text-align: center !important;
  color: var(--text-muted);
  padding: 48px 16px !important;
  height: auto !important;
}

.listing-versions td {
  background: #f7fbf9;
  padding: 0 14px 16px 8px;
  border-bottom: 1px solid #f0f2f4;
  vertical-align: top;
  height: auto;
}

.listing-footer {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  padding: 10px 8px 6px;
}

.listing-pagesize {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem;
  color: #6b7780;
  justify-self: start;
}

.listing-pagesize-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.listing-pagesize-wrap select {
  appearance: none;
  height: 28px;
  padding: 0 26px 0 10px;
  border: 1px solid #d7dde3;
  border-radius: 8px;
  background: #fff;
  font: inherit;
  font-size: 0.78rem;
  color: #2b3540;
  cursor: pointer;
}

.listing-pagesize-wrap svg {
  position: absolute;
  right: 7px;
  pointer-events: none;
  color: #6b7780;
}

.listing-range {
  margin: 0;
  font-size: 0.78rem;
  color: #6b7780;
  text-align: center;
}

.listing-pager {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  justify-self: end;
}

.listing-page-of {
  font-size: 0.78rem;
  color: #6b7780;
  margin-right: 6px;
  white-space: nowrap;
}

.listing-page-btn {
  display: grid;
  place-items: center;
  min-width: 28px;
  height: 28px;
  padding: 0 6px;
  border: 1px solid #d7dde3;
  border-radius: 8px;
  background: #fff;
  color: #5b6570;
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
}

.listing-page-btn:hover:not(:disabled):not(.is-current) {
  border-color: #b8c0c6;
  background: #f7f8f9;
}

.listing-page-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.listing-page-btn.is-current {
  background: #1b2430;
  border-color: #1b2430;
  color: #fff;
  pointer-events: none;
}

.score-cell {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.listing-table .score-ring {
  width: 18px;
  height: 18px;
  margin: 0;
}

.listing-table .score-ring::after {
  width: 12px;
  height: 12px;
}

.listing-table .score-ring span {
  display: none;
}

.score-pct {
  font-size: 0.8125rem;
  font-weight: 600;
  color: #2b3540;
  font-variant-numeric: tabular-nums;
}

.listing-table .score-ring.is-fail + .score-pct,
.listing-table .score-ring.is-high + .score-pct {
  color: var(--red);
}

.status-pill {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  background: #eef1f3;
  color: #5b6570;
  font-size: 0.75rem;
  font-weight: 500;
  white-space: nowrap;
}

.listing-table .risk-pill.is-pass {
  background: #f3e8ff;
  color: #7c3aed;
}

.score-ring {
  --p: 0;
  --ring: var(--green);
  --track: #e7eeea;
  width: 40px;
  height: 40px;
  margin: 0 auto;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--ring) calc(var(--p) * 1%), var(--track) 0);
}

.score-ring::after {
  content: "";
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #fff;
  grid-area: 1 / 1;
}

.score-ring span {
  grid-area: 1 / 1;
  z-index: 1;
  font-size: 0.68rem;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--navy-deep);
}

.score-ring.is-fail span {
  font-size: 0.52rem;
  letter-spacing: 0.02em;
  color: var(--red);
}

.score-ring.is-pass {
  --ring: var(--green);
  --track: #e4f6ea;
}

.score-ring.is-medium {
  --ring: #e0a21a;
  --track: #fff4d6;
}

.score-ring.is-high,
.score-ring.is-fail {
  --ring: var(--red);
  --track: #fde4e7;
}

.score-ring.is-high span {
  color: var(--red);
}

.risk-pill {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 600;
  white-space: nowrap;
}

.risk-pill.is-pass {
  background: var(--green-bg);
  color: var(--green);
}

.risk-pill.is-medium {
  background: var(--amber-bg);
  color: #b45309;
}

.risk-pill.is-high,
.risk-pill.is-fail {
  background: var(--red-bg);
  color: var(--red);
}

.risk-pill.is-pending {
  background: var(--amber-bg);
  color: #b45309;
}

.filters-scrim {
  position: fixed;
  inset: 0;
  background: rgba(17, 17, 17, 0.28);
  z-index: 70;
}

.filters-drawer {
  position: fixed;
  top: 56px;
  left: 0;
  bottom: 0;
  width: min(360px, 92vw);
  background: var(--surface);
  z-index: 71;
  display: flex;
  flex-direction: column;
  box-shadow: 8px 0 32px rgba(17, 17, 17, 0.12);
}

.filters-drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 20px 12px;
}

.filters-drawer-head h2 {
  margin: 0;
  font-size: 1.05rem;
}

.filters-drawer-body {
  flex: 1;
  overflow: auto;
  padding: 8px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.filters-drawer .filter-group {
  width: 100%;
}

.filters-drawer .filter-group select,
.filters-drawer .filter-group input[type="date"] {
  width: 100%;
}

.filters-drawer-foot {
  display: flex;
  gap: 10px;
  padding: 14px 20px 20px;
  border-top: 1px solid var(--border);
}

.filters-drawer-foot .btn {
  min-width: 88px;
}

.version-tree {
  margin: 4px 0 0 8px;
  overflow-x: auto;
}

.version-tree-head,
.version-tree-row {
  display: grid;
  grid-template-columns: 28px 64px minmax(140px, 1fr) minmax(140px, 1fr) 118px;
  gap: 12px;
  align-items: center;
  min-width: 620px;
}

.version-tree-head {
  padding: 8px 8px 6px;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.version-tree-row {
  position: relative;
  min-height: 36px;
  padding: 4px 8px;
  font-size: 0.8rem;
}

.version-tree-row .mono {
  font-family: var(--mono);
  font-size: 0.78rem;
}

.tree-gutter {
  position: relative;
  display: grid;
  place-items: center;
  height: 100%;
  min-height: 28px;
}

.tree-rail {
  position: absolute;
  left: 50%;
  top: -10px;
  bottom: -10px;
  width: 1px;
  background: #c5d0cb;
  transform: translateX(-50%);
}

.version-tree-row.is-last .tree-rail {
  bottom: 50%;
}

.tree-node {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #16303d;
  z-index: 1;
  box-shadow: 0 0 0 3px #f4faf7;
}

@media (max-width: 1100px) {
  .listing-footer {
    grid-template-columns: 1fr;
    justify-items: start;
  }

  .listing-range,
  .listing-pager {
    justify-self: start;
  }
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.page-header h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.page-subtitle {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--accent);
  margin-bottom: 12px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.back-link:hover {
  text-decoration: underline;
}

/* ---------- Controls ---------- */
.segmented {
  display: inline-flex;
  padding: 3px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  gap: 2px;
}

.segmented button {
  border: none;
  background: transparent;
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 0.825rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
}

.segmented button.active {
  background: var(--surface);
  color: var(--navy);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
}

.tier-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
}

.tier-strip.is-filter {
  padding: 0;
  background: transparent;
  border: 0;
  margin: 0;
  gap: 8px;
}

.tier-strip.is-filter .tier-stat {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  border-radius: 999px;
  padding: 8px 12px;
  cursor: pointer;
  font: inherit;
}

.tier-strip.is-filter .tier-stat.is-active {
  border-color: var(--navy);
  background: var(--navy-soft);
  color: var(--navy-deep);
}

.queue-priority-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: flex-end;
  margin-bottom: 14px;
}

.queue-search-group {
  flex: 1;
  min-width: 240px;
}

.queue-search-group input {
  width: 100%;
}

.col-sort {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  color: inherit;
  cursor: pointer;
}

.col-sort.is-right { margin-left: auto; }
.col-sort.is-center { margin-inline: auto; }

.sort-arrows {
  display: inline-flex;
  flex-direction: column;
  line-height: 0.55;
  font-size: 0.55rem;
  opacity: 0.35;
}

.sort-arrows .is-on {
  opacity: 1;
  color: var(--navy-deep);
}

.col-sort.is-active {
  color: var(--navy-deep);
}

.header-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.linkish {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: var(--navy);
  text-decoration: underline;
  cursor: pointer;
}

.stat-tile.is-link,
.compose-row.is-link,
.attention-row,
.trend-banner {
  text-decoration: none;
  color: inherit;
}

.stat-tile.is-link {
  display: block;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.stat-tile.is-link:hover,
.compose-row.is-link:hover,
.attention-row:hover {
  border-color: var(--navy);
}

.compose-row.is-link {
  display: grid;
}

.dash-concentrate,
.dash-attention {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px 28px;
}

.attention-row {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}

.trend-banner {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-muted);
  margin-bottom: 12px;
}

.trend-banner.is-up { border-color: var(--red-border); background: var(--red-bg); }
.trend-banner.is-down { border-color: var(--green-border); background: var(--green-bg); }

.risk-mix {
  display: grid;
  gap: 12px;
}

.risk-mix-bar {
  display: flex;
  height: 16px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--surface-muted);
}

.risk-mix-bar span,
.risk-mix-legend i {
  display: block;
}

.risk-mix-bar .is-high,
.risk-mix-legend .is-high { background: var(--red); }
.risk-mix-bar .is-medium,
.risk-mix-legend .is-medium { background: var(--amber); }
.risk-mix-bar .is-low,
.risk-mix-legend .is-low { background: var(--green); }

.risk-mix-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 20px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.risk-mix-legend i {
  width: 8px;
  height: 8px;
  border-radius: 99px;
  display: inline-block;
  margin-right: 6px;
}

.risk-mix-legend strong {
  color: var(--navy);
  margin: 0 4px;
}

.risk-mix-insight {
  margin: 0;
  font-size: 0.9rem;
  color: var(--text);
}

.share-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 4px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  color: inherit;
  text-decoration: none;
  font-size: 0.82rem;
}

a.share-row:hover {
  border-color: var(--navy);
}

.share-row-name {
  font-weight: 600;
  color: var(--navy);
}

.share-row-track {
  height: 8px;
  border-radius: 999px;
  background: var(--surface-muted);
  overflow: hidden;
}

.share-row-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--red);
}

.share-row-track.is-volume .share-row-fill {
  background: #16303d;
}

.share-row-meta {
  color: var(--text-muted);
}

.share-row-meta strong {
  color: var(--navy);
}

.fail-panel {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.fail-bars {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}

.fail-bar-row {
  display: grid;
  grid-template-columns: 24px minmax(0, 1.4fr) minmax(80px, 1fr) 48px;
  gap: 10px;
  align-items: center;
  font-size: 0.82rem;
}

.fail-bar-rank {
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.fail-bar-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.fail-bar-track {
  height: 8px;
  border-radius: 999px;
  background: var(--surface-muted);
  overflow: hidden;
}

.fail-bar-track span {
  display: block;
  height: 100%;
  background: var(--red);
  border-radius: 999px;
}

.fail-bar-val {
  text-align: right;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.modal-head h2 {
  margin: 0;
}

@media (max-width: 720px) {
  .fail-bar-row {
    grid-template-columns: 20px 1fr 40px;
  }
  .fail-bar-track {
    display: none;
  }
}

.pop.is-up { color: var(--red); font-weight: 600; }
.pop.is-down { color: var(--green); font-weight: 600; }
.pop.is-flat, .muted { color: var(--text-muted); }

.audit-scroll { max-height: 640px; overflow: auto; }

.tier-stat {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.875rem;
  color: var(--text-secondary);
}

.tier-stat strong {
  color: var(--text);
  font-weight: 600;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot.red { background: var(--red); }
.dot.yellow { background: #d97706; }
.dot.green { background: var(--green); }
.dot.amber { background: #d97706; }

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.toolbar-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-right: 8px;
}

.toolbar > div {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.toolbar select {
  padding: 8px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  min-width: 160px;
  color: var(--text);
}

/* ---------- Claims list ---------- */
.claims-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.claims-list-head,
.claim-row {
  display: grid;
  grid-template-columns: 4.75rem minmax(0, 1fr) 7.5rem 5.75rem 7.25rem 6.75rem;
  align-items: center;
  gap: 16px;
}

.claims-list-head {
  padding: 0 16px 6px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.claims-list.has-audit .claims-list-head {
  grid-template-columns: 32px 4.75rem minmax(0, 1fr) 7.5rem 5.75rem 7.25rem 6.75rem;
}

.claims-list-head .h-amount,
.claim-amount {
  text-align: right;
}

.claims-list-head .h-risk,
.claim-tier,
.claims-list-head .h-stage,
.claim-stage-cell {
  text-align: center;
}

.claims-list-head .h-due,
.due-badge {
  text-align: right;
}

.claim-row {
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  text-align: left;
  width: 100%;
}

.claim-row:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow);
}

.claim-item {
  display: flex;
  flex-direction: column;
}

.claim-row-line {
  display: grid;
  grid-template-columns: 32px 1fr;
  align-items: stretch;
}

.audit-toggle {
  display: grid;
  place-items: center;
  width: 32px;
  padding: 0;
  border: 1px solid var(--border);
  border-right: 0;
  border-radius: var(--radius) 0 0 var(--radius);
  background: var(--surface-muted);
  color: var(--text-muted);
  cursor: pointer;
}

.audit-toggle:hover {
  color: var(--navy-deep);
  background: var(--navy-soft);
}

.audit-toggle.is-open {
  color: var(--navy-deep);
  background: var(--navy-soft);
}

.audit-toggle svg {
  transition: transform 0.15s ease;
}

.audit-toggle.is-open svg {
  transform: rotate(90deg);
}

.claim-item .claim-row {
  border-radius: 0 var(--radius) var(--radius) 0;
}

.claim-item.is-open .claim-row {
  border-radius: 0 var(--radius) 0 0;
}

.claim-item.is-open .audit-toggle {
  border-radius: var(--radius) 0 0 0;
}

.claim-audit {
  border: 1px solid var(--border);
  border-top: 0;
  border-radius: 0 0 var(--radius) var(--radius);
  background: var(--surface-muted);
}

.claim-audit-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px 8px;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.claim-audit-head strong {
  color: var(--navy-deep);
  font-size: 0.85rem;
}

.claim-audit-scroll {
  overflow-x: auto;
  padding: 0 10px 12px;
}

.claim-audit-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
}

.claim-audit-table.version-table {
  min-width: 0;
}

.claim-audit-table th,
.claim-audit-table td {
  padding: 7px 8px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  white-space: nowrap;
}

.claim-audit-table th {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: #f8fbf9;
}

.claim-audit-table tr:last-child td {
  border-bottom: 0;
}

.claim-audit-table .mono {
  font-family: var(--mono);
}

.claim-audit-table .audit-comment {
  white-space: normal;
  min-width: 180px;
  color: var(--text-secondary);
}

.audit-status {
  display: inline-flex;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--green-bg);
  color: var(--green);
  font-weight: 600;
}

.audit-status.is-fail {
  background: var(--red-bg);
  color: var(--red);
}

.audit-status.is-bypassed,
.audit-status.is-waived {
  background: var(--amber-bg);
  color: var(--amber);
}

.version-link {
  appearance: none;
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  font-family: var(--mono);
  font-weight: 700;
  color: var(--navy);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}

.version-link:hover {
  color: #1a56a0;
}

.modal-card-version {
  width: min(880px, 100%);
  max-height: 88vh;
  overflow: auto;
  padding: 20px 22px 20px;
}

.version-dialog {
  width: min(980px, calc(100vw - 40px));
  max-height: min(90vh, 860px);
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
  border-radius: 16px;
}

.version-modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.version-dialog .version-modal-head {
  margin-bottom: 0;
  padding: 22px 28px 10px;
  flex: 0 0 auto;
}

.version-modal-title-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.version-lock {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-top: 2px;
  border-radius: 0;
  background: none;
  color: var(--accent);
  flex: 0 0 auto;
}

.version-lock svg {
  width: 20px;
  height: 20px;
}

.version-modal-kicker {
  margin: 0 0 2px;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
}

.version-modal-head h2 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--navy-deep);
  white-space: nowrap;
}

.version-modal-sub {
  margin: 4px 0 0;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-secondary);
}

.az-grid-table td.cell-wrap {
  white-space: normal;
  min-width: 240px;
}

.history-dialog .az-grid-table td:nth-child(2) {
  white-space: nowrap;
}

.version-modal-body {
  flex: 1 1 auto;
  overflow: auto;
  padding: 4px 28px 8px;
}

.version-modal-section {
  margin-top: 18px;
}

.version-modal-section h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 14px;
  padding: 0 0 8px;
  font-size: 0.92rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
  color: var(--navy-deep);
  background: none;
  border-radius: 0;
  border-bottom: 1px solid var(--border);
}

.version-modal-section h3::before {
  content: "";
  width: 3px;
  height: 14px;
  border-radius: 2px;
  background: var(--accent);
  flex: 0 0 auto;
}

.version-modal-foot {
  display: flex;
  justify-content: flex-end;
  flex: 0 0 auto;
  margin-top: 0;
  padding: 14px 28px 18px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

.version-modal-copy {
  margin: -6px 0 10px;
  color: var(--text-secondary);
  font-size: 0.8rem;
  line-height: 1.45;
}

.version-detail-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px 28px;
  margin: 0;
}

@media (max-width: 720px) {
  .version-detail-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 520px) {
  .version-detail-grid {
    grid-template-columns: 1fr;
  }
}

.version-detail-grid dt {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.version-detail-grid dd {
  margin: 4px 0 0;
  font-size: 0.875rem;
  color: var(--navy-deep);
}

.version-table-wrap {
  overflow-x: auto;
  border: 1px solid #e4eae6;
  border-radius: 8px;
}

.az-grid-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
  background: var(--surface);
}

.az-grid-table th,
.az-grid-table td {
  text-align: left;
  padding: 10px 12px;
  vertical-align: middle;
  border-bottom: 1px solid #eef2f0;
  white-space: nowrap;
}

.az-grid-table th {
  background: #eef2f0;
  color: #5f6b72;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.az-grid-table th::after {
  content: " :";
}

.az-grid-table tbody tr:last-child td {
  border-bottom: 0;
}

.az-grid-table td:nth-child(2) {
  white-space: normal;
  min-width: 200px;
}

.version-dialog .audit-status {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 4px;
  background: #d9f8e8;
  color: #13be2e;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.version-dialog .audit-status.is-fail {
  background: var(--red-bg);
  color: var(--red);
}

.version-dialog .audit-status.is-bypassed,
.version-dialog .audit-status.is-waived {
  background: var(--amber-bg);
  color: #b45309;
}

.version-dialog .tag.critical {
  margin-left: 6px;
  background: #fff;
  color: var(--red);
  border: 1px solid #f7b4bb;
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.version-change-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
}

.version-change-table th,
.version-change-table td {
  text-align: left;
  padding: 7px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.version-change-table th {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.version-uc-scroll {
  overflow-x: auto;
}

.ledger-table.version-table {
  min-width: 0;
}

.version-claim-scroll {
  max-height: min(560px, 70vh);
  overflow: auto;
}

.version-claim-scroll thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #f8fbf9;
}

.version-modal-backdrop {
  z-index: 90;
}

.claim-audit-empty {
  padding: 16px;
  color: var(--text-muted);
  font-size: 0.85rem;
}

.score-circle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 0.72rem;
  font-family: var(--mono);
  border: 2px solid;
}

.score-circle.sm {
  width: 42px;
  height: 42px;
  font-size: 0.68rem;
}

.score-circle.lg {
  width: 96px;
  height: 96px;
  font-size: 1.35rem;
  border-width: 3px;
}

.score-circle.is-fail-text {
  font-size: 0.62rem;
  letter-spacing: 0.02em;
}

.score-circle.sm.is-fail-text {
  font-size: 0.55rem;
}

.score-circle.lg.is-fail-text {
  font-size: 1.05rem;
}

.score-circle.red {
  color: var(--red);
  background: var(--red-bg);
  border-color: var(--red);
}

.score-circle.yellow {
  color: var(--amber);
  background: var(--amber-bg);
  border-color: #d97706;
}

.score-circle.green {
  color: var(--green);
  background: var(--green-bg);
  border-color: var(--green);
}

.claim-main {
  min-width: 0;
}

.claim-id-line {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 2px;
}

.claim-id {
  font-weight: 600;
  font-size: 0.9rem;
  white-space: nowrap;
}

.claim-name {
  color: var(--text-secondary);
  font-size: 0.875rem;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.tag.critical {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid var(--red-border);
}

.tag.knockout {
  background: #f1f5f9;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.tag.override {
  background: var(--mint-soft);
  color: var(--accent-text);
  border: 1px solid var(--accent);
}

.tag.pending {
  background: var(--amber-bg);
  color: var(--amber);
  border: 1px solid var(--amber-border);
}

.claim-amount {
  font-weight: 600;
  font-size: 0.9rem;
  text-align: right;
  white-space: nowrap;
}

.claim-tier {
  font-size: 0.8rem;
  font-weight: 600;
  min-width: 88px;
  text-align: center;
}

.claim-tier.red { color: var(--red); }
.claim-tier.yellow { color: var(--amber); }
.claim-tier.green { color: var(--green); }

.claim-stage-cell {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-align: center;
  min-width: 96px;
}

.due-badge {
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  min-width: 72px;
  text-align: right;
}

.due-badge.urgent {
  color: var(--urgent);
  font-weight: 700;
}

.empty-state {
  padding: 48px 24px;
  text-align: center;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
}

.empty-state a {
  color: #1a56a0;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.empty-state a:hover {
  color: #16303d;
}

/* ---------- Claim detail ---------- */
.claim-detail-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
}

.claim-detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
}

.meta-item label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.meta-item .value {
  font-size: 0.95rem;
  font-weight: 600;
}

.hardfail-banner {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  color: var(--red);
}

.hardfail-banner .banner-icon {
  flex-shrink: 0;
  margin-top: 2px;
}

.hardfail-banner strong {
  display: block;
  font-size: 0.95rem;
  margin-bottom: 2px;
}

.hardfail-banner p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.4;
  color: #991b1b;
}

.score-panel {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 22px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.score-panel-text h2 {
  margin: 0 0 6px;
  font-size: 1.15rem;
}

.score-panel-text .tier-label {
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 6px;
}

.score-panel-text .summary-line {
  margin: 0;
  color: var(--text-secondary);
  font-size: 0.875rem;
}

.result-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.result-filter {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
}

.result-filter.active {
  border-color: var(--navy);
  background: var(--navy-soft);
  color: var(--navy);
  font-weight: 600;
}

.result-filter .count {
  font-family: var(--mono);
  font-size: 0.75rem;
  margin-left: 4px;
  opacity: 0.8;
}

.checks-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.check-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.check-row.no-weight {
  grid-template-columns: 28px 1fr;
}

.check-row.fail {
  border-left: 3px solid var(--red);
}

.check-row.cant_evaluate {
  border-left: 3px solid #d97706;
}

.check-row.pass {
  border-left: 3px solid var(--green);
}

.check-row.bypassed,
.check-row.waived {
  border-left: 3px solid var(--accent);
}

.check-state-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin-top: 1px;
}

.check-state-icon.pass {
  background: var(--green-bg);
  color: var(--green);
}

.check-state-icon.fail {
  background: var(--red-bg);
  color: var(--red);
}

.check-state-icon.cant_evaluate {
  background: var(--amber-bg);
  color: var(--amber);
}

.check-state-icon.bypassed,
.check-state-icon.waived {
  background: var(--navy-soft);
  color: var(--navy);
}

.check-body .check-name {
  font-weight: 600;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.check-body .evidence {
  margin: 4px 0 0;
  font-size: 0.825rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.check-weight {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  font-family: var(--mono);
  white-space: nowrap;
  padding-top: 2px;
  text-align: right;
}

.check-weight-was,
.check-weight-excluded,
.check-weight-gate {
  display: block;
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--text-muted);
}

.stage-norm-hint {
  margin: 8px 0 0;
  font-size: 0.78rem;
  color: var(--text-secondary);
}

/* ---------- Dashboard ---------- */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
  align-items: flex-end;
}

.toolbar-panel {
  display: flex;
  flex-wrap: nowrap;
  gap: 12px 14px;
  align-items: flex-end;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
  overflow-x: auto;
}

.toolbar-panel .filter-group {
  flex: 0 0 164px;
  width: 164px;
  min-width: 0;
}

.toolbar-panel .queue-search-group {
  flex: 1 1 auto;
  width: auto;
  min-width: 200px;
  max-width: none;
}

.toolbar-panel .filter-date-pair {
  display: flex;
  gap: 12px;
  flex: 0 0 auto;
}

.toolbar-panel .filter-date-pair .filter-group {
  flex: 0 0 148px;
  width: 148px;
}

.toolbar-panel .filter-group select,
.toolbar-panel .filter-group input[type="date"],
.toolbar-panel .filter-group input[type="search"] {
  min-width: 0;
  width: 100%;
}

.toolbar-panel:not(:has(.queue-search-group)) .filter-group {
  flex: 1 1 164px;
  width: auto;
  max-width: 220px;
}

@media (max-width: 760px) {
  .toolbar-panel {
    flex-wrap: wrap;
  }

  .toolbar-panel .filter-group,
  .toolbar-panel .filter-date-pair .filter-group,
  .toolbar-panel:not(:has(.queue-search-group)) .filter-group {
    flex: 1 1 148px;
    width: auto;
    max-width: none;
  }

  .toolbar-panel .queue-search-group {
    flex: 1 1 100%;
    min-width: 0;
  }

  .toolbar-panel .filter-date-pair {
    flex: 1 1 100%;
  }
}

.section-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 16px;
  margin-bottom: 12px;
}

.section-toolbar .section-chips {
  margin-bottom: 0;
}

.section-toolbar .filter-group {
  min-width: 200px;
}

.export-menu {
  position: relative;
  display: inline-block;
}

.export-menu-panel {
  position: absolute;
  right: 0;
  top: calc(100% + 4px);
  z-index: 30;
  min-width: 188px;
  padding: 6px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
}

.export-menu-panel button {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 6px;
  padding: 8px 10px;
  font: inherit;
  font-size: 0.85rem;
  color: var(--text);
  cursor: pointer;
}

.export-menu-panel button:hover {
  background: var(--navy-soft);
}

.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.pager-bar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 16px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.pager-bar .pager {
  flex: 1;
  min-width: 0;
  justify-content: flex-end;
  margin-top: 0;
}

.pager-size {
  min-width: 120px;
  width: 120px;
}

.pager-size select {
  min-width: 0;
}

.pager-meta {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.pager-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.pager-ellipsis {
  min-width: 1.25rem;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.85rem;
}

.pager-page {
  min-width: 2rem;
  justify-content: center;
}

.pager-page.is-current {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
  pointer-events: none;
}

.claims-list-scroll {
  max-height: min(68vh, 720px);
  overflow: auto;
  padding-right: 2px;
}

.claims-list-scroll .claims-list-head {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--bg);
}

.listing-card {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(17, 17, 17, 0.03);
}

.listing-card .listing-table-wrap {
  border: none;
  background: #fff;
}

.audit-table {
  background: #fff;
}

.audit-table thead th {
  background: #f0f2f4;
  color: #5b6570;
}

.audit-table tbody td {
  background: #fff;
}

.audit-table th.col-type,
.audit-table td.col-type {
  text-align: left;
  vertical-align: middle;
  width: 7.5rem;
  min-width: 7.5rem;
}

.audit-table td.col-type {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.01em;
}

.audit-table .col-claim,
.audit-table .col-fnol {
  white-space: nowrap;
}

.audit-toolbar {
  gap: 8px;
}

.audit-toolbar .listing-search {
  flex: 0 1 280px;
  max-width: 320px;
}

.audit-toolbar .listing-search input {
  height: 30px;
  border-radius: 999px;
}

.audit-toolbar-export {
  margin-left: auto;
}

.audit-toolbar .export-menu .btn-export {
  height: 36px;
}

.audit-custom-dates {
  margin: 0;
}

.filter-group {
  min-width: 160px;
}

.filter-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.filter-group select,
.filter-group input[type="date"],
.filter-group input[type="search"] {
  display: block;
  width: 100%;
  min-width: 160px;
  height: 40px;
  padding: 8px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  box-sizing: border-box;
}

.queue-filters {
  margin-bottom: 16px;
}

.usecase-fail-table .check-code {
  margin-right: 8px;
}

.scope-line {
  margin: 0 0 16px;
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.report-sticky-bar {
  position: sticky;
  top: 0;
  z-index: 4;
  background: var(--bg);
  padding: 4px 0 4px;
  margin: 0 0 8px;
}

.report-sticky-bar .scope-line {
  margin-bottom: 8px;
}

.report-scorecard {
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
}

.report-compose {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 24px;
}

.compose-title {
  margin: 0 0 10px;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

.compose-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: baseline;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}

.compose-row .muted,
.sample-table .muted,
.ledger-comment {
  color: var(--text-muted);
}

.section-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}

.chip {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
}

.chip:hover,
.chip.active {
  border-color: var(--accent);
  background: var(--mint-soft);
  color: var(--navy-deep);
}

.usecase-fail-row.is-button {
  width: 100%;
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  cursor: pointer;
}

.usecase-fail-row.is-button:hover,
.usecase-fail-row.is-selected {
  border-color: var(--accent);
  background: var(--navy-soft);
}

.sample-table-wrap {
  overflow-x: auto;
}

.sample-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.825rem;
}

.sample-table th,
.sample-table td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}

.sample-table th {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-muted);
}

.sample-table a {
  font-weight: 600;
  color: #1a56a0;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.sample-table a:hover {
  color: #16303d;
}

.sample-table .mono {
  font-family: var(--mono);
  font-weight: 600;
}

.ledger-day {
  margin-top: 14px;
}

.ledger-day-title {
  margin: 0 0 8px;
  font-size: 0.8rem;
  color: var(--navy-deep);
}

.ledger-table {
  min-width: 1100px;
}

.ledger-row {
  display: grid;
  grid-template-columns: 52px minmax(120px, auto) minmax(110px, 1fr) minmax(160px, 1.6fr) auto auto minmax(120px, 1fr);
  gap: 10px;
  align-items: baseline;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.8rem;
}

.ledger-time {
  font-family: var(--mono);
  color: var(--text-muted);
}

.ledger-claim {
  font-weight: 600;
  color: var(--navy-deep);
}

.ledger-delta {
  color: var(--text);
}

.ledger-chip {
  display: inline-flex;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--navy-soft);
  color: var(--navy);
  font-size: 0.7rem;
  font-weight: 600;
}

.ledger-comment {
  font-size: 0.75rem;
}

@media (max-width: 900px) {
  .ledger-row {
    grid-template-columns: 1fr 1fr;
  }
}

.stat-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}

.stat-tile .label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-bottom: 8px;
}

.stat-tile .value {
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.stat-tile .sub {
  margin-top: 4px;
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.panel-header h2 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
}

.risk-breakdown {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.risk-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 16px;
  align-items: center;
}

.risk-row-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 0.875rem;
}

.risk-metrics {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.risk-numbers {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.risk-numbers strong {
  color: var(--text);
}

.bar-track {
  height: 8px;
  background: #eef2f6;
  border-radius: 999px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 999px;
}

.bar-fill.red { background: var(--red); }
.bar-fill.yellow { background: #d97706; }
.bar-fill.green { background: var(--green); }

.chart-wrap {
  position: relative;
  height: 280px;
}

.chart-empty {
  height: 220px;
  display: grid;
  place-items: center;
  color: var(--text-muted);
  font-size: 0.9rem;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
}

/* ---------- Config ---------- */
.info-banner {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  background: #f1f5f9;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 20px;
  color: var(--text-secondary);
}

.info-banner .lock-icon {
  flex-shrink: 0;
  color: var(--text-muted);
  margin-top: 1px;
}

.info-banner strong {
  display: block;
  color: var(--text);
  margin-bottom: 2px;
  font-size: 0.9rem;
}

.info-banner p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.4;
}

.config-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.config-section h2 {
  margin: 0 0 4px;
  font-size: 1rem;
}

.config-section .section-desc {
  margin: 0 0 16px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.config-check {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.config-check:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.config-check:first-of-type {
  padding-top: 0;
}

.config-check .name {
  font-weight: 600;
  font-size: 0.9rem;
}

.config-check .category {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.weight-input-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}

.weight-input-wrap input {
  width: 72px;
  padding: 7px 8px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  text-align: right;
  font-family: var(--mono);
  font-size: 0.875rem;
}

.weight-input-wrap input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(13, 110, 138, 0.12);
}

.weight-input-wrap .pct {
  font-size: 0.85rem;
  color: var(--text-muted);
  font-weight: 600;
}

.config-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  position: sticky;
  bottom: 16px;
  box-shadow: var(--shadow);
}

.running-total {
  font-size: 0.95rem;
  font-weight: 600;
}

.running-total .total-value {
  font-family: var(--mono);
  font-size: 1.1rem;
  margin-left: 6px;
}

.running-total.at-100 .total-value {
  color: var(--green);
}

.running-total.not-100 .total-value {
  color: var(--amber);
}

.save-feedback {
  font-size: 0.85rem;
  margin: 0 0 12px;
}

.save-feedback.error {
  color: var(--red);
}

.save-feedback.success {
  color: var(--green);
  font-weight: 600;
}

.footer-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .stat-tiles {
    grid-template-columns: repeat(2, 1fr);
  }

  .claims-list-head {
    display: none;
  }

  .claim-row,
  .claims-list.has-audit .claim-row {
    grid-template-columns: 48px 1fr;
    gap: 12px;
  }

  .claim-amount,
  .claim-tier,
  .claim-stage-cell,
  .due-badge {
    grid-column: 2;
    text-align: left;
    min-width: 0;
  }

  .claim-amount { margin-top: -4px; }
  .nav-capsule {
    display: none;
  }

  .mobile-nav {
    display: flex !important;
  }

  .topbar {
    grid-template-columns: 1fr auto;
    height: 56px;
    padding: 0 16px;
  }

  .topbar-date,
  .topbar-icon-btn,
  .topbar-lang {
    display: none;
  }
}

.mobile-nav {
  display: none;
  gap: 4px;
  padding: 8px 16px 12px;
  background: var(--bg);
  border-bottom: none;
  overflow-x: auto;
}

.mobile-nav .nav-link {
  height: 36px;
  padding: 0 12px;
  background: rgba(255, 255, 255, 0.55);
}

.mobile-nav .nav-link.active {
  background: #fff;
}

@media (max-width: 600px) {
  .main {
    padding: 20px 14px 40px;
  }

  .stat-tiles {
    grid-template-columns: 1fr;
  }

  .login-card {
    padding: 28px 20px 22px;
  }

  .topbar {
    padding: 0 14px;
  }

  .persona-meta .name {
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
}

/* ---------- Azentio extras ---------- */
.login-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0 14px;
  color: var(--text-muted);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.login-divider::before,
.login-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.btn-sso {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  color: var(--navy);
  font-weight: 600;
}

.btn-sso:hover:not(:disabled) {
  background: var(--navy-soft);
  border-color: var(--navy);
}

.modal-backdrop,
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 34, 43, 0.45);
  z-index: 80;
  display: flex;
  justify-content: flex-end;
}

.modal-backdrop {
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-card {
  width: min(420px, 100%);
  background: var(--surface);
  border-radius: 14px;
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.modal-card.version-dialog,
.modal-card.history-dialog,
.modal-card.modal-card-version {
  width: min(980px, calc(100vw - 40px));
  max-width: none;
  max-height: min(90vh, 860px);
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
  border-radius: 16px;
}

.modal-card.version-dialog h2,
.modal-card.history-dialog h2,
.modal-card.modal-card-version h2 {
  margin: 0;
  white-space: nowrap;
}

.modal-card.modal-card-wide {
  width: min(560px, 100%);
  max-width: none;
}

.modal-card h2 {
  margin: 0 0 8px;
  font-size: 1.15rem;
  color: var(--navy-deep);
}

.modal-copy {
  margin: 0 0 16px;
  color: var(--text-secondary);
  font-size: 0.875rem;
  line-height: 1.45;
}

.sso-persona-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}

.sso-persona {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
  cursor: pointer;
}

.sso-persona:hover {
  border-color: var(--accent);
  background: var(--navy-soft);
}

.sso-persona strong {
  display: block;
  font-size: 0.9rem;
}

.sso-persona small {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.claim-link {
  background: none;
  border: none;
  padding: 0;
  color: var(--accent);
  font-weight: 700;
  font-size: inherit;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.claim-link:hover {
  color: var(--accent-hover);
}

.claim-drawer {
  width: min(420px, 100%);
  height: 100%;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -8px 0 32px rgba(22, 48, 61, 0.12);
  display: flex;
  flex-direction: column;
  animation: slideIn 0.2s ease;
}

@keyframes slideIn {
  from { transform: translateX(24px); opacity: 0.6; }
  to { transform: translateX(0); opacity: 1; }
}

.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}

.drawer-header h2 {
  margin: 0;
  font-size: 1.05rem;
}

.drawer-sub {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 0.8rem;
  font-family: var(--mono);
}

.drawer-body {
  padding: 18px 20px 28px;
  overflow: auto;
}

.drawer-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.drawer-section-title {
  margin: 22px 0 10px;
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stage-score-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.stage-score-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  background: var(--surface-muted);
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
}

.icon-btn {
  appearance: none;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
}

.icon-btn:hover {
  background: var(--surface-muted);
  color: var(--navy);
}

.check-code {
  display: inline-flex;
  align-items: center;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent-text);
  background: var(--mint-soft);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 1px 6px;
  margin-right: 6px;
}

.score-circle.xs {
  width: 34px;
  height: 34px;
  font-size: 0.55rem;
  border-width: 2px;
}

.score-circle.xs.is-fail-text {
  font-size: 0.48rem;
}

.stage-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.stage-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
}

button.stage-chip {
  cursor: pointer;
  font: inherit;
}

button.stage-chip:hover {
  border-color: var(--border-strong);
}

button.stage-chip.is-active {
  border-color: var(--accent);
  background: var(--mint-soft);
  color: var(--navy-deep);
}

.stage-block {
  margin-bottom: 18px;
}

.stage-block-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.stage-block-header h3 {
  margin: 0;
  font-size: 0.95rem;
  color: var(--navy-deep);
}

.stage-block-header p {
  margin: 2px 0 0;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.config-subhead {
  margin: 16px 0 8px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stage-config .running-total {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.stage-fail-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stage-fail-card {
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
}

.stage-fail-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 0.85rem;
  margin-bottom: 8px;
}

.stage-fail-top span {
  color: var(--text-muted);
}

.stage-fail-top-uc {
  margin: 8px 0 0;
  font-size: 0.75rem;
  color: var(--text-secondary);
  line-height: 1.35;
}

.usecase-fail-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.usecase-fail-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 16px;
  align-items: center;
}

.usecase-fail-meta {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.usecase-fail-meta strong {
  display: block;
  font-size: 0.875rem;
}

.usecase-fail-meta small {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.usecase-fail-bar-wrap {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
}

@media (max-width: 800px) {
  .stage-fail-grid,
  .usecase-fail-row,
  .drawer-grid {
    grid-template-columns: 1fr;
  }
}

/* ---------- Config table ---------- */
.config-layout {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.config-subnav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 12px;
}

.config-subnav-item {
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}

.config-subnav-item:hover,
.config-subnav-item.is-active {
  border-color: var(--accent);
  background: var(--mint-soft);
  color: var(--navy-deep);
}

.config-stage-pane {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.config-criteria-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.config-criteria-card h2 {
  margin: 0 0 6px;
  font-size: 1rem;
}

.config-criteria-card p {
  margin: 0;
  color: var(--text-secondary);
  font-size: 0.85rem;
}

.config-pass-field {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.config-pass-input {
  display: flex;
  align-items: center;
  gap: 6px;
}

.config-pass-input input {
  width: 72px;
}

.config-mix-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  width: 100%;
}

.config-mix-card {
  flex-direction: column;
}

.config-weight-footer {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface-muted);
  font-size: 0.85rem;
}

.config-weight-footer.is-ok strong {
  color: var(--green);
}

.config-weight-footer.is-warn strong {
  color: var(--amber);
}

.config-weight-footer small {
  color: var(--text-muted);
}

@media (max-width: 900px) {
  .config-layout {
    grid-template-columns: 1fr;
  }
  .config-subnav {
    flex-direction: row;
    flex-wrap: wrap;
    position: static;
  }
}

.config-page-header {
  align-items: flex-end;
}

.config-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.version-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.current-version-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--mint-soft);
  border: 1px solid var(--accent);
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent-text);
}

.readonly-tag {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: var(--surface);
  border-radius: 999px;
  padding: 2px 8px;
  color: var(--text-muted);
}

.prev-versions-wrap {
  position: relative;
}

.prev-versions-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.prev-versions-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 280px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 40;
  padding: 6px;
}

.prev-version-item {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--text);
}

.prev-version-item:hover {
  background: var(--mint-soft);
}

.prev-empty {
  padding: 12px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.config-table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.config-table-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-muted);
}

.config-table-wrap {
  overflow: auto;
}

.config-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

.config-table th {
  text-align: left;
  padding: 12px 14px;
  background: #f7fcf9;
  border-bottom: 1px solid var(--border);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  white-space: nowrap;
}

.config-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.config-table .col-menu {
  width: 44px;
  padding-left: 10px;
  padding-right: 4px;
}

.uc-name {
  font-weight: 600;
  color: var(--navy-deep);
  min-width: 180px;
}

.uc-desc {
  color: var(--text-secondary);
  max-width: 320px;
  line-height: 1.4;
}

.uc-weight {
  font-family: var(--mono);
  font-weight: 600;
}

.empty-cell {
  text-align: center;
  color: var(--text-muted);
  padding: 28px !important;
}

.cat-pill {
  display: inline-flex;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: capitalize;
}

.cat-critical {
  background: var(--red-bg);
