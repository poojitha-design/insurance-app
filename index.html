  color: var(--red);
  border: 1px solid var(--red-border);
}

.cat-high {
  background: var(--amber-bg);
  color: var(--amber);
  border: 1px solid var(--amber-border);
}

.cat-low {
  background: var(--mint-soft);
  color: var(--accent-text);
  border: 1px solid var(--accent);
}

.row-menu-wrap {
  position: relative;
}

.row-menu-btn {
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
}

.row-menu-btn:hover {
  background: var(--mint-soft);
  color: var(--accent-text);
}

.row-menu {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 200px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  z-index: 30;
  padding: 4px;
}

.row-menu button {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  padding: 8px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.825rem;
}

.row-menu button:hover {
  background: var(--mint-soft);
}

.row-menu button.danger {
  color: var(--red);
}

.btn-danger {
  background: var(--red);
  color: white;
  border: 1px solid var(--red);
}

.btn-danger:hover:not(:disabled) {
  background: #991b1b;
}

.modal-card-wide {
  width: min(560px, 100%);
}

.field-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.field-row-2 {
  grid-template-columns: repeat(2, 1fr);
}

.version-dates-block {
  margin-top: 16px;
  padding: 14px 14px 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
}

.version-dates-block.is-disabled {
  opacity: 0.55;
}

.version-dates-block.is-disabled input {
  background: #eef1f3;
  cursor: not-allowed;
}

.version-dates-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.version-dates-hint {
  margin: 0 0 12px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text-secondary);
}

.version-dates-error {
  margin: 0 0 12px;
  font-size: 12px;
  color: #b91c1c;
  font-weight: 500;
}

.optional-label {
  font-weight: 400;
  color: var(--text-secondary);
}

.required-mark {
  color: #b91c1c;
  font-weight: 700;
}

.modal-card input[type='date'] {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font: inherit;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.value-readonly {
  padding: 10px 12px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-weight: 600;
}

.modal-card textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  resize: vertical;
  background: var(--surface-muted);
  color: var(--text-secondary);
  font: inherit;
}

.modal-card select,
.config-table-filters select,
.config-table-filters input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
}

@media (max-width: 700px) {
  .field-row {
    grid-template-columns: 1fr;
  }
}




.version-notice {
  margin: 0 0 14px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid #86efac;
  background: #f0fdf4;
  color: #166534;
  font-size: 13px;
  line-height: 1.45;
  font-weight: 500;
}

.btn-request {
  background: #0f766e;
}

.btn-request:hover:not(:disabled) {
  background: #0d9488;
}

.uc-picker {
  position: relative;
}

.uc-picker-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  font: inherit;
  color: var(--text);
}

.uc-picker-trigger-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.uc-picker-caret {
  color: var(--text-secondary);
}

.uc-status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  background: #cbd5e1;
}

.uc-picker-trigger.is-enabled .uc-status-dot,
.uc-picker-option.is-enabled .uc-status-dot,
.uc-status-dot.is-enabled {
  background: #22c55e;
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
}

.uc-picker-trigger.is-locked .uc-status-dot,
.uc-picker-option.is-locked .uc-status-dot,
.uc-status-dot.is-locked {
  background: #94a3b8;
}

.uc-picker-menu {
  position: absolute;
  z-index: 40;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  max-height: 280px;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
  padding: 8px;
}

.uc-picker-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 4px 6px 10px;
  font-size: 12px;
  color: var(--text-secondary);
}

.uc-picker-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.uc-picker-group-label {
  padding: 8px 8px 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.uc-picker-empty {
  padding: 12px;
  font-size: 13px;
  color: var(--text-secondary);
}

.uc-picker-option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: var(--text);
}

.uc-picker-option:hover,
.uc-picker-option.is-selected {
  background: var(--surface-muted);
}

.uc-picker-option.is-locked {
  color: #64748b;
}

.uc-picker-option-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.uc-picker-code {
  font-family: "Poppins", system-ui, sans-serif;
  font-size: 12px;
  font-weight: 600;
}

.uc-picker-name {
  font-size: 13px;
  line-height: 1.35;
}

.uc-picker-badge {
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 999px;
}

.uc-picker-option.is-enabled .uc-picker-badge {
  background: #dcfce7;
  color: #166534;
}

.stage-block-score {
  display: flex;
  align-items: center;
  gap: 8px;
}

.empty-checks {
  padding: 10px 12px;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.doc-complete-chip {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--navy);
  background: var(--mint-soft);
  border: 1px solid var(--accent);
  border-radius: 999px;
  padding: 3px 8px;
  white-space: nowrap;
}

.doc-disclosure {
  margin-top: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-muted);
}

.doc-disclosure > summary {
  cursor: pointer;
  list-style: none;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 10px 14px;
}

.doc-disclosure > summary::-webkit-details-marker {
  display: none;
}

.doc-disclosure > summary::after {
  content: '▸';
  float: right;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.doc-disclosure[open] > summary::after {
  content: '▾';
}

.doc-disclosure .doc-checklist {
  margin-top: 0;
  padding: 0 10px 10px;
}

.doc-checklist {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.doc-checklist-label {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 2px 2px 0;
}

.stage-hold-note {
  margin: 0 0 10px;
  padding: 10px 12px;
  font-size: 0.82rem;
  line-height: 1.45;
  color: var(--text-secondary);
  background: var(--amber-bg, #fff6e5);
  border: 1px solid var(--amber);
  border-radius: var(--radius-sm);
}

.doc-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: left;
  font: inherit;
  color: inherit;
  width: 100%;
}

.doc-row.is-action {
  cursor: pointer;
}

.doc-row.is-action:hover {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(95, 255, 190, 0.25);
}

.doc-row.missing {
  border-left: 3px solid var(--amber);
}

.doc-row.rejected {
  border-left: 3px solid var(--red);
}

.doc-row.is-highlight.missing {
  background: var(--amber-bg, #fff8eb);
}

.doc-row.is-highlight.rejected {
  background: var(--red-bg, #fff1f1);
}

.doc-row.uploaded,
.doc-row.already_on_file,
.doc-row.waived {
  border-left: 3px solid var(--green);
}

.doc-row-title {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.doc-name {
  font-weight: 600;
  font-size: 0.88rem;
}

.doc-min {
  font-weight: 500;
  color: var(--text-muted);
  font-size: 0.75rem;
}

.doc-note {
  margin: 4px 0 0;
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.doc-why {
  margin: 4px 0 0;
  font-size: 0.78rem;
  color: var(--text-muted);
  line-height: 1.4;
}

.doc-status {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.doc-status.missing { color: var(--amber); }
.doc-status.rejected { color: var(--red); }
.doc-status.uploaded,
.doc-status.already_on_file,
.doc-status.waived { color: var(--green); }

.tag.doc-required {
  background: var(--navy-soft);
  color: var(--navy);
  border: 1px solid var(--border-strong);
}

.tag.doc-optional {
  background: #f1f5f9;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.tag.doc-conditional {
  background: #fff7ed;
  color: #c2410c;
  border: 1px solid #fdba74;
}

.doc-thumb {
  width: 56px;
  height: 44px;
  border-radius: 6px;
  background: linear-gradient(135deg, #16303d 0%, #1d4d3c 100%);
  color: var(--mint);
  display: grid;
  place-items: center;
  font-size: 0.62rem;
  font-weight: 700;
  text-align: center;
  padding: 4px;
  line-height: 1.2;
}

.doc-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 160px;
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 0.7rem;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--surface-muted);
  color: var(--text-secondary);
}

.doc-chip.pdf {
  background: #f8fafc;
  color: var(--navy);
}

.doc-chip.missing {
  opacity: 0.55;
  border-style: dashed;
}

.doc-chip.on-file {
  background: var(--mint-soft);
  border-color: var(--accent);
  color: var(--navy);
}

.doc-chip.waived {
  background: #f1f5f9;
}

.doc-chip-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--mono);
  font-weight: 500;
}

.surveyor-banner {
  margin: 0 0 16px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--navy-soft);
  color: var(--navy);
}

.surveyor-banner strong {
  display: block;
  font-size: 0.9rem;
  margin-bottom: 4px;
}

.surveyor-banner p {
  margin: 0;
  font-size: 0.82rem;
  line-height: 1.4;
  color: var(--text-secondary);
}

.surveyor-banner.is-done {
  border-color: #86efac;
  background: #f0fdf4;
}

.surveyor-banner.is-done strong {
  color: #166534;
}

.surveyor-submit {
  margin-top: 12px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.surveyor-submit p {
  margin: 0;
  font-size: 0.82rem;
  color: var(--text-secondary);
  flex: 1;
  min-width: 220px;
}

.exception-block {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}

.exception-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.exception-status {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--navy);
}

.exception-status.is-pending {
  color: #b45309;
}

.exception-status.is-back {
  color: var(--red);
}

.exception-note,
.exception-lead,
.exception-evidence {
  margin: 0;
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.exception-panel {
  width: 100%;
  margin-top: 4px;
  padding: 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--navy-soft);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.exception-panel strong {
  color: var(--navy-deep);
  font-size: 0.85rem;
}

.exception-fields {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
}

.exception-panel label,
.exception-fields label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
}

.exception-panel input,
.exception-panel textarea {
  font: inherit;
  font-weight: 500;
  color: var(--text);
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
}

.exception-panel textarea {
  resize: vertical;
  min-height: 56px;
}

.tier-label .tag {
  margin-left: 6px;
  vertical-align: middle;
}

/* ---------- Risk overview (ClaimFlow layout, AZ colour) ---------- */
.ov-page {
  display: grid;
  gap: 20px;
}

.ov-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.ov-head h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.ov-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.ov-search {
  position: relative;
  min-width: 220px;
  flex: 1 1 220px;
  max-width: 280px;
}

.ov-search-wide {
  flex: 1 1 auto;
  width: min(560px, 100%);
  min-width: 380px;
  max-width: 560px;
}

.ov-search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  display: grid;
  pointer-events: none;
}

.ov-search input,
.ov-select {
  height: 40px;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
}

.ov-search input {
  width: 100%;
  padding: 8px 12px 8px 38px;
}

.ov-select {
  padding: 0 12px;
  min-width: 140px;
}

.ov-search input:focus,
.ov-select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(46, 219, 142, 0.22);
}

.ov-report {
  height: 40px;
  white-space: nowrap;
}

.ov-kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}

.ov-kpi {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  min-height: 168px;
  padding: 20px 20px 16px;
  border-radius: 18px;
  text-decoration: none;
  overflow: hidden;
  box-shadow: 0 10px 28px rgba(17, 17, 17, 0.06);
  color: inherit;
  cursor: default;
}

.ov-kpi:hover {
  box-shadow: 0 10px 28px rgba(17, 17, 17, 0.06);
}

.ov-kpi-icon {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.16);
  margin-bottom: 4px;
}

.ov-kpi-value {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1.1;
}

.ov-kpi-label {
  font-size: 0.88rem;
  font-weight: 500;
  opacity: 0.86;
}

.ov-kpi-delta {
  margin-top: auto;
  font-size: 0.78rem;
  font-weight: 600;
}

.ov-kpi.is-navy {
  background: linear-gradient(145deg, #1c4454 0%, #16303d 58%, #0e222c 100%);
  color: #fff;
}

.ov-kpi.is-navy .ov-kpi-delta {
  color: var(--accent);
}

.ov-kpi.is-mint {
  background: linear-gradient(145deg, #4ae6a3 0%, #2edb8e 48%, #1bb574 100%);
  color: #0b1f18;
}

.ov-kpi.is-mint .ov-kpi-icon {
  background: rgba(11, 31, 24, 0.12);
}

.ov-kpi.is-mint .ov-kpi-delta {
  color: #16303d;
  opacity: 0.82;
}

.ov-kpi.is-mint .ov-kpi-delta.is-up {
  color: #16303d;
  opacity: 0.9;
}

.ov-kpi.is-white {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--navy-deep);
}

.ov-kpi.is-white .ov-kpi-icon {
  background: var(--mint-soft);
  color: #16303d;
}

.ov-kpi.is-white .ov-kpi-icon.is-alert {
  background: var(--red-bg);
  color: var(--red);
}

.ov-kpi.is-white .ov-kpi-label,
.ov-kpi.is-white .ov-kpi-delta {
  color: var(--text-muted);
  font-weight: 500;
}

.ov-kpi.is-white .ov-kpi-delta.is-up {
  color: var(--red);
  font-weight: 600;
}

.ov-kpi.is-white .ov-kpi-delta.is-down {
  color: var(--green);
  font-weight: 600;
}

.ov-kpi-flag {
  position: absolute;
  top: 18px;
  right: 16px;
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--red-bg);
  color: var(--red);
  font-size: 0.7rem;
  font-weight: 700;
}

.ov-spark {
  display: block;
  width: 100%;
  height: 44px;
  margin-top: 4px;
}

.ov-charts {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(260px, 0.9fr);
  gap: 14px;
}

.ov-charts.is-equal {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.ov-charts.is-equal .ov-chart-h {
  height: 200px;
}

.ov-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px 18px 16px;
  box-shadow: 0 8px 24px rgba(17, 17, 17, 0.04);
  min-width: 0;
}

.ov-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 12px;
}

.ov-card-head h2 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  color: var(--navy-deep);
}

.ov-card-head p {
  margin: 2px 0 0;
  font-size: 0.78rem;
  color: var(--text-muted);
}

.ov-card-actions {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 8px;
  flex: 0 0 auto;
}

.ov-card-table .ov-card-actions {
  flex: 1 1 auto;
  justify-content: flex-end;
  min-width: 0;
}

.ov-card-table .ov-search {
  flex: 1 1 auto;
  width: 100%;
  min-width: 380px;
  max-width: 560px;
}

.ov-card-table .ov-search input,
.ov-card-table .ov-toolbar-row .ov-select,
.ov-card-table .ov-card-actions .btn,
.ov-toolbar-end .btn {
  height: 36px;
}

.ov-toolbar-row {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 14px;
}

.ov-toolbar-row .ov-pills {
  flex: 0 1 auto;
  min-width: 0;
}

.ov-toolbar-end {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

.ov-toolbar-row .ov-select {
  min-width: 148px;
  width: 168px;
}

.ov-select.ov-date {
  min-width: 148px;
}

.ov-tools .export-menu .btn,
.ov-tools .btn-export {
  height: 40px;
}

.ov-head .export-menu .btn-export {
  min-width: 140px;
  height: 44px;
  padding: 0 22px;
  font-size: 0.95rem;
}

.ov-card-table .ov-card-actions .btn-export,
.ov-toolbar-end .btn-export {
  height: 36px;
}

.ov-card .pager {
  margin-top: 12px;
  padding-top: 4px;
}

.ov-pills {
  display: inline-flex;
  padding: 3px;
  background: var(--surface-muted);
  border-radius: 999px;
  gap: 2px;
}

.ov-pills button {
  border: 0;
  background: transparent;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
}

.ov-pills button.is-on {
  background: #16303d;
  color: #fff;
}

.ov-chart-h {
  height: 220px;
}

.ov-donut {
  display: grid;
  justify-items: center;
  gap: 12px;
}

.ov-donut-plot {
  position: relative;
  width: 180px;
  height: 180px;
}

.ov-donut-center {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  pointer-events: none;
}

.ov-donut-center strong {
  font-size: 1.35rem;
  letter-spacing: -0.03em;
}

.ov-donut-center span {
  font-size: 0.72rem;
  color: var(--text-muted);
}

.ov-donut-legend {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
  width: 100%;
  font-size: 0.8rem;
}

.ov-donut-legend li {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-secondary);
}

.ov-donut-legend i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}

.ov-donut-legend .is-high { background: var(--red); }
.ov-donut-legend .is-medium { background: var(--amber); }
.ov-donut-legend .is-low { background: var(--green); }

.ov-donut-legend span {
  margin-left: auto;
  font-weight: 700;
  color: var(--navy-deep);
}

.ov-bottom {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(260px, 0.9fr);
  gap: 14px;
}

.ov-table-wrap {
  overflow-x: auto;
}

.ov-table {
  width: 100%;
  border-collapse: collapse;
}

.ov-table th,
.ov-table td {
  padding: 12px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-size: 0.82rem;
  white-space: nowrap;
}

.ov-table th {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.ov-table .col-num {
  text-align: right;
}

.ov-table .is-urgent {
  color: var(--red);
  font-weight: 600;
}

.ov-workload {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.ov-work-row {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  text-decoration: none;
  color: inherit;
}

.ov-work-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 0.7rem;
  font-weight: 700;
  background: var(--mint-soft);
  color: #16303d;
}

.ov-work-copy {
  min-width: 0;
  display: grid;
  gap: 6px;
}

.ov-work-copy strong {
  font-size: 0.82rem;
  font-weight: 600;
}

.ov-work-track {
  height: 8px;
  border-radius: 999px;
  background: #eef3f0;
  overflow: hidden;
}

.ov-work-track span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #2edb8e, #16303d);
}

.ov-work-n {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--navy-deep);
}

.ov-scope {
  margin: -8px 0 0;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.ov-kpis.is-six {
  grid-template-columns: repeat(6, minmax(0, 1fr));
}

.ov-kpis.is-six .ov-kpi {
  min-height: 156px;
  padding: 16px 16px 14px;
}

.ov-kpis.is-six .ov-kpi-value {
  font-size: 1.45rem;
}

.ov-compose {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px 28px;
}

.ov-compose.is-charts {
  gap: 20px;
  align-items: start;
}

.ov-compose.is-charts .ov-chart-h {
  height: 200px;
  margin-bottom: 8px;
}

.ov-donut-plot.is-sm {
  width: 150px;
  height: 150px;
}

.ov-compose.is-charts .ov-donut {
  margin-bottom: 8px;
}

.ov-compose-col h3 {
  margin: 0 0 8px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.ov-compose-note {
  margin: 0;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.ov-mix-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 10px;
  align-items: baseline;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.82rem;
}

.ov-mix-row:last-child {
  border-bottom: 0;
}

.ov-mix-row strong {
  color: var(--navy-deep);
}

.ov-mix-row em {
  font-style: normal;
  color: var(--text-muted);
  font-size: 0.75rem;
}

@media (max-width: 1180px) {
  .ov-kpis,
  .ov-charts,
  .ov-bottom {
    grid-template-columns: 1fr 1fr;
  }

  .ov-kpis.is-six,
  .ov-compose,
  .ov-charts.is-equal {
    grid-template-columns: 1fr 1fr;
  }

  .ov-card-wide {
    grid-column: 1 / -1;
  }
}

@media (max-width: 720px) {
  .ov-kpis,
  .ov-kpis.is-six,
  .ov-charts,
  .ov-bottom,
  .ov-compose {
    grid-template-columns: 1fr;
  }

  .ov-kpi {
    min-height: 148px;
  }

  .version-modal-head h2 {
    white-space: normal;
  }
}

/* ---------- Claim details (compact workbench) ---------- */
.cd-crumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.cd-crumb .back-link {
  color: #16303d;
  margin: 0;
  font-size: 0.8rem;
}

.cd-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px 20px 22px;
  box-shadow: var(--shadow);
}

.cd-stage-card {
  margin-top: 16px;
  background: #fff;
  border: 1px solid #e6eaec;
  border-radius: 16px;
  padding: 14px 16px 22px;
  box-shadow: var(--shadow);
}

.cd-stage-card .cd-stepper {
  display: flex;
  align-items: center;
  width: 100%;
  margin: 0 0 16px;
  padding: 5px;
  background: #16303d;
  border: 0;
  border-radius: 10px;
  box-shadow: none;
  gap: 4px;
}

.cd-stage-card .cd-step {
  color: #fff;
  background: transparent;
  border-radius: 7px;
  padding: 7px 14px;
  font-size: 0.88rem;
  font-weight: 500;
}

.cd-stage-card .cd-step.is-active {
  background: #e7ebed;
  color: #16303d;
  font-weight: 600;
  box-shadow: none;
}

.cd-stage-card .cd-step:hover:not(.is-active) {
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
}

.cd-stage-card .cd-stage-block {
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
}

.cd-stage-card .cd-tab-body {
  padding-top: 0;
}

.cd-stage-card .cd-section-head h3 {
  display: flex;
  align-items: center;
  gap: 10px;
}

.cd-stage-card .cd-section-head h3::before {
  content: "";
  width: 3px;
  height: 16px;
  border-radius: 2px;
  background: #2ed88e;
  flex-shrink: 0;
}

.cd-stage-card .cd-section-head .result-filters {
  margin: 0;
}

.cd-stage-card .result-filter {
  border-color: #e4e7ea;
  background: #fff;
  color: #5c6e77;
  padding: 5px 12px;
}

.cd-stage-card .result-filter.active {
  background: #16303d;
  border-color: #16303d;
  color: #fff;
}

.cd-stage-card .result-filter .count {
  font-family: inherit;
  opacity: 1;
}

.cd-onfile {
  color: #1f9d57;
  font-size: 0.84rem;
  font-weight: 500;
}

.stage-score {
  margin-bottom: 18px;
}

.stage-score-top {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 16px;
}

.stage-score-rule {
  height: 2px;
  background: #e8eaec;
}

.stage-score-top h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  font-size: 1rem;
  font-weight: 600;
  color: #16303d;
}

.stage-score-top h2 i {
  width: 3px;
  height: 18px;
  border-radius: 2px;
  background: #2ed88e;
  flex-shrink: 0;
}

.stage-score-top span {
  color: #7b959c;
  font-size: 0.82rem;
  font-weight: 500;
}

.stage-score p {
  margin: 4px 0 10px;
  color: #6b7280;
  font-size: 0.84rem;
  font-weight: 500;
}

.stage-score-bar {
  display: flex;
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  background: #e5e7eb;
}

.stage-score-bar .is-pass { background: #22c55e; }
.stage-score-bar .is-fail { background: #ef4444; }

.stage-score-legend {
  display: flex;
  justify-content: flex-start;
  gap: 16px;
  margin-top: 8px;
  color: #16303d;
  font-size: 0.78rem;
  font-weight: 500;
}

.stage-score-legend i {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 6px;
  border-radius: 50%;
  vertical-align: 1px;
}

.stage-score-legend .is-pass { background: #22c55e; }
.stage-score-legend .is-fail { background: #ef4444; }

.cd-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
}

.cd-summary-main {
  flex: 1;
  min-width: 0;
}

.cd-summary-main h1 {
  margin: 4px 0 22px;
  font-size: 1.35rem;
  font-weight: 600;
  color: #25324c;
  letter-spacing: -0.02em;
}

.cd-summary-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: 28px;
  row-gap: 22px;
}

.cd-field-label {
  display: block;
  margin-bottom: 6px;
  font-size: 0.78rem;
  font-weight: 400;
  color: #5c6e77;
}

.cd-field-value {
  font-size: 0.92rem;
  font-weight: 600;
  color: #16303d;
}

.cd-field-link {
  color: #3451a3;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.cd-field-link:hover {
  color: #1d3f86;
}

.cd-scorecard {
  flex: 0 0 420px;
  display: flex;
  align-items: center;
  gap: 22px;
  min-height: 148px;
  padding: 16px 22px 16px 18px;
  border: 1px solid #dce0e2;
  border-radius: 16px;
  background: linear-gradient(118deg, #eafbf4 0%, #ffffff 68%);
}

.cd-donut {
  position: relative;
  width: 118px;
  height: 118px;
  border-radius: 50%;
  background: conic-gradient(from -90deg, var(--arc, #2ed88e) calc(var(--p) * 1%), #d9d9d9 0);
  flex-shrink: 0;
}

.cd-donut span {
  position: absolute;
  inset: 11px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #fff;
  color: var(--arc, #2ed88e);
  font-size: 1.55rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.cd-scorecard h2 {
  margin: 0 0 10px;
  font-size: 1.28rem;
  font-weight: 700;
  color: #25324c;
  letter-spacing: -0.02em;
}

.cd-score-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 56px;
  height: 28px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid #389563;
  background: #dcfdef;
  color: #198060;
  font-size: 0.82rem;
  font-weight: 600;
}

.cd-score-pill.is-low {
  border-color: #d9a441;
  background: #fff6df;
  color: #8a5a00;
}

.cd-score-pill.is-high,
.cd-score-pill.is-fail {
  border-color: #f24456;
  background: #fdecee;
  color: #c42334;
}

.cd-score-note {
  margin: 10px 0 0;
  font-size: 0.84rem;
  font-weight: 500;
  color: #7b959c;
}

.sum-table-wrap {
  border: 1px solid #e4e8ea;
  border-radius: 10px;
  overflow: hidden;
}

.sum-table {
  width: 100%;
  border-collapse: collapse;
  margin: 0;
}

.sum-table th {
  text-align: left;
  font-size: 0.78rem;
  font-weight: 600;
  color: #5b6570;
  padding: 10px 12px;
  background: #f0f2f4;
  border-bottom: 1px solid #e4e8ea;
}

.sum-table td {
  padding: 14px 12px;
  border-top: 1px solid #eef2f0;
  font-size: 0.86rem;
  vertical-align: middle;
  background: #fff;
}

.sum-table tbody tr:first-child td {
  border-top: 0;
}

.sum-table tbody tr {
  cursor: pointer;
}

.sum-table tbody tr:hover td {
  background: #f7fbf9;
}

.sum-stage {
  font-weight: 600;
  color: #16303d;
}

.sum-score {
  font-weight: 700;
  color: #16303d;
}

.sum-score.is-low { color: #b45309; }
.sum-score.is-high,
.sum-score.is-fail { color: #f24456; }
.sum-score.is-pass { color: #128a4a; }

.sum-action.is-clear { color: #8aa0a6; }

.sum-open {
  color: #3451a3;
  font-size: 0.78rem;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.cd-stage-score {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.cd-stage-score h3 {
  margin: 0;
}

.cd-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 18px;
}

.cd-head h1 {
  margin: 0;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--navy-deep);
  letter-spacing: -0.02em;
}

.cd-sub {
  margin: 6px 0 0;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.cd-sub span {
  color: var(--text-secondary);
}

.cd-head-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.cd-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 8px;
  border-radius: 999px;
  background: #ecfdf3;
  color: #13be2e;
  font-size: 0.75rem;
  font-weight: 600;
}

.cd-status.is-fail {
  background: var(--red-bg);
  color: var(--red);
}

.cd-status::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.cd-risk {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  background: var(--green-bg);
  color: var(--green);
}

.cd-risk.yellow {
  background: var(--amber-bg);
  color: #b45309;
}

.cd-risk.red,
.cd-risk.is-fail {
  background: var(--red-bg);
  color: var(--red);
}

.cd-meta {
  display: grid;
  grid-template-columns: minmax(280px, 1.1fr) minmax(320px, 1.2fr);
  gap: 28px 40px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
}

.cd-meta-col {
  display: grid;
  gap: 8px;
}

.cd-meta-row {
  display: grid;
  grid-template-columns: 148px 10px minmax(0, 1fr);
  align-items: center;
  gap: 6px;
  font-size: 0.84rem;
}

.cd-meta-label {
  color: var(--text-muted);
  font-weight: 500;
}

.cd-meta-colon {
  color: var(--text-muted);
}

.cd-meta-value {
  font-weight: 600;
  color: var(--navy-deep);
}

.cd-id {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.cd-copy {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--mint);
  cursor: pointer;
  border-radius: 4px;
  flex-shrink: 0;
}

.cd-copy:hover {
  background: var(--mint-soft);
  color: #13be2e;
}

.cd-copy.is-copied {
  color: #13be2e;
}

.cd-meta-parties {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.cd-party h4 {
  margin: 0 0 8px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
}

.cd-party p {
  margin: 0 0 4px;
  font-size: 0.84rem;
  font-weight: 500;
  color: var(--navy-deep);
}

.cd-stepper {
  display: inline-flex;
  align-items: center;
  gap: 0;
  margin: 18px 0 8px;
  padding: 5px;
  background: #fff;
  border: 1px solid #ececec;
  border-radius: 999px;
  box-shadow: 0 1px 2px rgba(17, 17, 17, 0.05);
  overflow-x: auto;
  max-width: 100%;
}

.cd-step {
  appearance: none;
  flex: 0 0 auto;
  height: auto;
  border: 0;
  margin: 0;
  padding: 9px 22px;
  background: none;
  color: #111;
  font-size: 0.92rem;
  font-weight: 500;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  line-height: 1.2;
  clip-path: none;
}

.cd-step.is-active {
  background: #e7fbf3;
  color: #0b1f18;
  font-weight: 600;
  box-shadow: none;
}

.cd-step:hover:not(.is-active) {
  color: #111;
}

.cd-tabs {
  display: flex;
  gap: 4px;
  margin-top: 10px;
  border-bottom: 1px solid var(--border);
}

.cd-tab {
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 12px 14px;
  font-size: 0.84rem;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
}

.cd-tab span {
  color: var(--text-muted);
  font-weight: 500;
}

.cd-tab.is-active {
  color: var(--navy-deep);
  font-weight: 600;
  border-bottom-color: var(--navy-deep);
}

.cd-tab:hover {
  color: var(--navy-deep);
}

.cd-tab-body {
  padding-top: 18px;
}

.cd-stage-block {
  margin-top: 14px;
  padding: 16px 16px 8px;
  border: 1px solid #ececec;
  border-radius: 16px;
  background: #fbfcfb;
}

.cd-stage-block .cd-finance {
  margin-bottom: 14px;
}

.cd-finance {
  margin-bottom: 20px;
}

.cd-finance-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 10px;
}

.cd-finance-head h3 {
  margin: 0;
  font-size: 1rem;
  font-weight: 600;
}

.cd-finance-head p {
  margin: 4px 0 0;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.cd-finance-total {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--navy-deep);
}

.cd-mixbar {
  display: flex;
  height: 14px;
  border-radius: 999px;
  overflow: hidden;
  background: #eef2f0;
  gap: 3px;
}

.cd-mixbar span {
  display: block;
  min-width: 0;
}

.cd-mixbar .is-pass,
.cd-mixlegend i.is-pass {
  background: #13be2e;
}

.cd-mixbar .is-due,
.cd-mixlegend i.is-due {
  background: #ffc33d;
}

.cd-mixbar .is-fail,
.cd-mixlegend i.is-fail {
  background: #f24456;
}

.cd-mixlegend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 10px;
  font-size: 0.78rem;
  color: var(--text-secondary);
}

.cd-mixlegend i {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
}

.cd-section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 8px 0 12px;
}

.cd-section-head h3 {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 600;
}

.cd-link {
  appearance: none;
  background: none;
  border: 0;
  padding: 0;
  color: #1a56a0;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.cd-link:hover {
  color: #16303d;
}

.cd-muted {
  font-size: 0.78rem;
  color: var(--text-muted);
}

.cd-filters {
  margin: 0;
}

.cd-checks {
  margin-bottom: 18px;
}

.cd-thumbs {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
  gap: 12px;
}

.cd-thumbs.is-compact {
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
}

.cd-thumb {
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: #fff;
  text-align: left;
  color: inherit;
  font: inherit;
}

.cd-thumb.is-action {
  cursor: pointer;
}

.cd-thumb.is-action:hover,
.cd-thumb.is-highlight {
  border-color: var(--amber);
  box-shadow: 0 0 0 3px rgba(255, 195, 61, 0.18);
}

.cd-thumb.uploaded,
.cd-thumb.already_on_file {
  border-color: #d8eee0;
}

.cd-thumb-preview {
  position: relative;
  height: 108px;
  display: grid;
  place-items: center;
  background: #f3f7f5;
  color: var(--text-muted);
  font-size: 0.72rem;
  font-weight: 600;
}

.cd-thumbs.is-compact .cd-thumb-preview {
  height: 92px;
}

.cd-thumb-preview.is-photo {
  background:
    linear-gradient(160deg, hsla(var(--h, 160), 45%, 28%, 0.92), hsla(calc(var(--h, 160) + 28), 38%, 18%, 0.95)),
    repeating-linear-gradient(135deg, transparent 0 12px, rgba(255,255,255,0.06) 12px 13px);
  color: #e8fbf3;
}

.cd-photo-label {
  font-size: 0.7rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.cd-thumb-count {
  position: absolute;
  right: 8px;
  bottom: 8px;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 999px;
  background: rgba(17, 17, 17, 0.72);
  color: #fff;
  font-size: 0.68rem;
  display: grid;
  place-items: center;
}

.cd-thumb-preview.is-pdf {
  background: #f8fafc;
  align-content: center;
  gap: 8px;
}

.cd-pdf-badge {
  display: inline-flex;
  padding: 4px 8px;
  border-radius: 6px;
  background: var(--navy-deep);
  color: #fff;
  font-size: 0.68rem;
  font-weight: 700;
}

.cd-pdf-name {
  max-width: 86%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-secondary);
  font-weight: 500;
}

.cd-thumb-preview.is-missing {
  border-bottom: 1px dashed var(--border);
  color: var(--text-muted);
  gap: 4px;
}

.cd-thumb-plus {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px dashed var(--border-strong);
  display: grid;
  place-items: center;
  font-size: 1.1rem;
  font-weight: 500;
}

.cd-thumb-preview.is-waived {
  background: #f1f5f9;
}

.cd-thumb-meta {
  padding: 10px 10px 12px;
}

.cd-thumb-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--navy-deep);
  line-height: 1.3;
  margin-bottom: 6px;
}

.cd-thumb-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.cd-doc-group {
  margin-bottom: 22px;
}

.cd-doc-group-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}

.cd-doc-group-head h3 {
  margin: 0;
  font-size: 0.88rem;
}

.cd-doc-group-head span {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.cd-doclist {
  list-style: none;
  margin: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  background: #fff;
}

.cd-docitem {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
}

.cd-docitem:last-child {
  border-bottom: 0;
}

.cd-doccheck {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1.5px solid var(--border-strong);
  display: grid;
  place-items: center;
  color: #16303d;
  background: #fff;
}

.cd-docitem.is-view .cd-doccheck {
  border-color: #2edb8e;
  background: #e9fbf3;
  color: #13be2e;
}

.cd-docitem.is-missing .cd-doccheck {
  background: #fff;
}

.cd-docname {
  font-size: 0.88rem;
  font-weight: 600;
  color: #16303d;
}

.cd-docstatus {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.cd-docitem.is-view .cd-docstatus {
  color: #13be2e;
}

.cd-docitem.is-missing .cd-docstatus {
  color: var(--text-muted);
}

.cd-empty {
  margin: 0;
  padding: 18px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  color: var(--text-muted);
  font-size: 0.85rem;
}

.cd-versions .claim-audit-head {
  display: none;
}

.cd-stage-card .hardfail-banner,
.cd-stage-card .surveyor-banner {
  margin: 12px 12px 0;
}

@media (max-width: 980px) {
  .cd-meta,
  .cd-meta-parties,
  .cd-summary-grid {
    grid-template-columns: 1fr 1fr;
  }

  .cd-summary,
  .cd-head {
    flex-direction: column;
    align-items: stretch;
  }

  .cd-scorecard {
    flex-basis: auto;
  }
}

@media (max-width: 720px) {
  .cd-card,
  .cd-stage-card {
    padding: 16px;
    border-radius: 12px;
  }

  .cd-stepper {
    overflow-x: auto;
  }

  .cd-tabs {
    overflow-x: auto;
  }

  .cd-meta-row {
    grid-template-columns: 120px 10px minmax(0, 1fr);
  }
}

.cfg-page .cfg-stepper {
  margin: 4px 0 16px;
}

.cfg-stepper .cd-step.is-active {
  background: #111;
  color: var(--mint);
}

.cfg-hero {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  margin-bottom: 18px;
}

.cfg-kicker {
  margin: 0 0 6px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mint);
}

.cfg-hero-copy h1 {
  margin: 0 0 6px;
  font-size: 1.7rem;
  letter-spacing: -0.03em;
  color: #16303d;
}

.cfg-hero-copy p:last-child {
  margin: 0;
  max-width: 520px;
  color: var(--text-secondary);
  font-size: 0.9rem;
  line-height: 1.45;
}

.cfg-hero-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
}

.cfg-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.cfg-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  box-shadow: 0 8px 20px rgba(17, 17, 17, 0.04);
}

.cfg-stat span {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-secondary);
}

.cfg-stat strong {
  font-size: 1.35rem;
  font-weight: 700;
  color: #16303d;
  letter-spacing: -0.02em;
}

.cfg-board {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 28px rgba(17, 17, 17, 0.05);
}

.cfg-board-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  padding: 18px 20px 16px;
  background:
    linear-gradient(180deg, #f7fbf9 0%, #ffffff 100%);
  border-bottom: 1px solid var(--border);
}

.cfg-board-head h2 {
  margin: 0 0 6px;
  font-size: 1.05rem;
  color: #16303d;
}

.cfg-board-head p {
  margin: 0;
  max-width: 640px;
  color: var(--text-secondary);
  font-size: 0.84rem;
  line-height: 1.45;
}

.cfg-pass-inline {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.cfg-pass-inline label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.cfg-board-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  background: #f7fbf9;
  border-bottom: 1px solid var(--border);
}

function documentApplies(claim, def) {
  if (!def) return false;
  const type = claim.claimType || 'own_damage';
  if (!def.condition) return true;
  if (def.condition === 'tp') return type === 'tp';
  if (def.condition === 'theft') return type === 'theft';
  if (def.condition === 'total_loss') return type === 'total_loss';
  if (def.condition === 'towed') return !!claim.towed;
  if (def.condition === 'police') return type === 'tp' || type === 'theft';
  return true;
}

function emptyDocRecord() {
  return { status: 'missing', filename: null, thumb: null, note: '', count: 0 };
}

function getDocRecord(claim, docId) {
  return claim.documents?.[docId] || emptyDocRecord();
}

function countMeetsMin(def, rec) {
  return (rec.count || 0) >= (def.minCount || 1);
}

function isDocumentSatisfied(claim, def) {
  if (!def) return false;
  const rec = getDocRecord(claim, def.id);
  if (rec.status === 'waived') return true;
  if (rec.status === 'uploaded' && countMeetsMin(def, rec)) return true;
  if (def.carryFrom) {
    const prior = DOCUMENT_CATALOG.find((d) => d.id === def.carryFrom);
    if (prior && isDocumentSatisfied(claim, prior) && rec.status !== 'rejected') return true;
  }
  return false;
}

/** Required or applicable-conditional docs still outstanding for a check. */
function missingRequiredDocsForCheck(claim, checkId) {
  return DOCUMENT_CATALOG.filter((def) => {
    if (!def.linkedCheckIds?.includes(checkId)) return false;
    if (def.required === 'optional') return false;
    if (!documentApplies(claim, def)) return false;
    return !isDocumentSatisfied(claim, def);
  });
}

function uploadedDocsForCheck(claim, checkId) {
  return DOCUMENT_CATALOG.filter((def) => {
    if (!def.linkedCheckIds?.includes(checkId)) return false;
    if (!documentApplies(claim, def)) return false;
    const rec = getDocRecord(claim, def.id);
    return rec.status === 'uploaded' && countMeetsMin(def, rec);
  });
}

function getStageDocumentRows(claim, stageId) {
  return DOCUMENT_CATALOG.filter((def) => def.stage === stageId && documentApplies(claim, def)).map((def) => {
    const rec = getDocRecord(claim, def.id);
    const prior = def.carryFrom ? DOCUMENT_CATALOG.find((d) => d.id === def.carryFrom) : null;

      isDocumentSatisfied(claim, prior) &&
      rec.status !== 'uploaded' &&
      rec.status !== 'rejected' &&
      rec.status !== 'waived';

      def,
      rec,
      displayStatus: carried ? 'already_on_file' : rec.status,
      alreadyOnFile: !!carried,
    };
  });
}

function getStageDocCompleteness(claim, stageId) {
  const rows = getStageDocumentRows(claim, stageId).filter((row) => row.def.required !== 'optional');
  const done = rows.filter((row) => isDocumentSatisfied(claim, row.def)).length;
  return { done, total: rows.length };
}

function hasStageDocsComplete(claim, stageId) {
  const { done, total } = getStageDocCompleteness(claim, stageId);
  return total === 0 || done === total;
}

function hasPassedPriorStages(claim, stageIds) {
  return stageIds.every((id) => hasStageDocsComplete(claim, id) && !stageHasCriticalFail(claim, id));
}

/** Claims that cleared FNOL + Registration and are waiting on assessment submit. */
function isReadyForSurveyor(claim) {
  return hasPassedPriorStages(claim, ['fnol', 'intimation']) && !claim.surveyorSubmitted;
}

function stageHasCriticalFail(claim, stageId, stageScores = claim?.stageScores) {
  return (stageScores || []).some((s) => s.stageId === stageId && s.criticalFailed);
}

/** Current workflow stage for queue column / filters. A critical fail holds the claim on that stage. */
function getClaimWorkflowStage(claim, stageScores) {
  const scores = stageScores || claim?.stageScores;
  if (!hasStageDocsComplete(claim, 'fnol') || stageHasCriticalFail(claim, 'fnol', scores)) return 'fnol';
  if (!hasStageDocsComplete(claim, 'intimation') || stageHasCriticalFail(claim, 'intimation', scores)) return 'intimation';
  if (!claim.surveyorSubmitted || !hasStageDocsComplete(claim, 'assessment') || stageHasCriticalFail(claim, 'assessment', scores)) {
    return 'assessment';
  }
  return 'settlement';
}

const WORKFLOW_STAGES = [
  { id: 'fnol', name: 'FNOL' },
  { id: 'intimation', name: 'Registration' },
  { id: 'assessment', name: 'Assessment' },
  { id: 'settlement', name: 'Settlement' },
];

function submitSurveyorAssessment(claimId) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return { ok: false, message: 'Claim not found.' };
  if (!hasStageDocsComplete(claim, 'assessment')) {
    return { ok: false, message: 'Upload all required Assessment documents before submitting.' };
  }
  claim.surveyorSubmitted = true;
  appendClaimAudit(claimId, {
    user: 'Hassan Al-Falasi',
    action: 'Submitted',
    changeType: 'Status',
    entity: 'Stage',
    field: 'Claim stage',
    oldValue: 'Assessment',
    newValue: 'Settlement',
    comments: 'Assessment documents submitted for further scoring.',
  });
  return { ok: true, message: 'Submitted for further scoring. This claim has moved to the next stage.' };
}

function defaultUploadedRecord(def) {
  const pdf = def.kind === 'pdf';
  const count = def.minCount || 1;
  return {
    status: 'uploaded',
    filename: pdf ? `${def.id}.pdf` : `${def.id}-01.jpg`,
    thumb: pdf ? 'PDF' : count > 1 ? `${count} photos` : 'Photo',
    note: 'On file from intake.',
    count,
  };
}

function seedDocuments(claim, overrides = {}) {
  const docs = {};
  DOCUMENT_CATALOG.forEach((def) => {
    if (!documentApplies(claim, def)) return;
    if (overrides[def.id]) {
      docs[def.id] = { ...emptyDocRecord(), ...overrides[def.id] };
      return;
    }
    if (def.required === 'optional') {
      docs[def.id] = {
        ...emptyDocRecord(),
        note: 'Not provided.',
      };
      return;
    }
    if (def.carryFrom) {
      docs[def.id] = emptyDocRecord();
      return;
    }
    docs[def.id] = defaultUploadedRecord(def);
  });
  return docs;
}

function mockUploadClaimDocument(claimId, docId, actor) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  const def = DOCUMENT_CATALOG.find((d) => d.id === docId);
  if (!claim || !def) return null;
  const pdf = def.kind === 'pdf';
  const count = def.minCount || 1;
  const prev = claim.documents?.[docId];
  claim.documents = claim.documents || {};
  claim.documents[docId] = {
    status: 'uploaded',
    filename: pdf ? `${def.id}-uploaded.pdf` : `${def.id}-upload-01.jpg`,
    thumb: pdf ? 'PDF' : count > 1 ? `${count} photos` : 'Photo',
    note: 'Uploaded in Claim Intel (demo).',
    count,
  };
  appendClaimAudit(claimId, {
    user: actor?.name || 'Demo user',
    action: 'Uploaded',
    changeType: 'Upload',
    entity: 'Document',
    field: def.name,
    oldValue: prev?.filename || 'Missing',
    newValue: claim.documents[docId].filename,
    comments: `Document captured at ${stageDisplayName(def.stage)}.`,
  });
  persistClaimRuntime(claim);
  return claim.documents[docId];
}

function buildChecks(overrides = {}) {
  return USE_CASE_LIBRARY.map((def) => {
    const o = overrides[def.id] || {};
    return {
      checkId: def.id,
      state: /** @type {CheckState} */ (o.state || 'pass'),
      evidence:
        o.evidence ||
        (def.hardFail
          ? 'Matched policy record — no discrepancy found'
          : 'Within expected range for this claim profile'),
    };
  });
}

function shiftDate(iso, days) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function parseVehicle(vehicle) {
  const raw = String(vehicle || '');
  const [left, colourPart] = raw.split('·').map((s) => s.trim());
  const yearMatch = (left || '').match(/(\d{4})$/);
  const year = yearMatch ? yearMatch[1] : '';
  const rest = (left || '').replace(/\s+\d{4}$/, '').trim();
  const parts = rest.split(' ').filter(Boolean);
  return {
    make: parts[0] || '',
    model: parts.slice(1).join(' '),
    year,
    colour: colourPart || '',
  };
}

function composeVehicle(claim) {
  const year = claim.vehicleYear ? ` ${claim.vehicleYear}` : '';
  const colour = claim.vehicleColour ? ` · ${claim.vehicleColour}` : '';
  return `${claim.vehicleMake || ''} ${claim.vehicleModel || ''}${year}${colour}`.replace(/\s+/g, ' ').trim();
}

function expandPortfolioClaims(base, target = 128) {
  const extra = [];
  let i = 0;
  while (base.length + extra.length < target) {
    const handler = PORTFOLIO_HANDLERS[i % PORTFOLIO_HANDLERS.length];
    const filedAt = shiftDate('2026-08-11', -((i * 3) % 340));
    const failPattern = PORTFOLIO_FAILS[(i * 5 + 2) % PORTFOLIO_FAILS.length];
    extra.push({
      id: `CLM-2026-${String(90001 + i)}`,
      claimant: `${PORTFOLIO_FIRST[i % PORTFOLIO_FIRST.length]} ${PORTFOLIO_LAST[(i * 5) % PORTFOLIO_LAST.length]}`,
      amount: 4200 + ((i * 1733) % 148000),
      currency: 'AED',
      assignedTo: handler.assignedTo,
      assignedName: handler.assignedName,
      branch: PORTFOLIO_BRANCHES[i % PORTFOLIO_BRANCHES.length],
      filedAt,
      dueInDays: (i % 16) - 3,
      plate: `${BRANCH_PREFIX[PORTFOLIO_BRANCHES[i % PORTFOLIO_BRANCHES.length]] || 'D'} ${12000 + i}`,
      vehicle: PORTFOLIO_VEHICLES[i % PORTFOLIO_VEHICLES.length],
      checks: buildChecks(failPattern),
      claimType: PORTFOLIO_TYPES[i % PORTFOLIO_TYPES.length],
      towed: i % 5 === 0,
      holdAtAssessment: i % 9 === 3,
    });
    i += 1;
  }

/** Keep field-level checks in sync with seeded fail states so scores stay varied. */
function applyEvaluableFailFields(claim) {
  const failed = new Set(
    (claim.checks || [])
      .filter((c) => c.state === 'fail' || c.state === 'cant_evaluate')
      .map((c) => c.checkId)
  );
  if (!failed.size) return claim;
  const same = (a, b) =>
    String(a || '')
      .trim()
      .toLowerCase() ===
    String(b || '')
      .trim()
      .toLowerCase();
  if (failed.has(1) && same(claim.plate, claim.policyPlate)) {
    claim.policyPlate = 'XX 00-00000';
  }
  if (failed.has(2) && same(claim.vin, claim.policyVin)) {
    claim.policyVin = 'MISMATCHVIN0000000';
  }
  if (failed.has(3) && claim.lossDate) {
    claim.policyStart = shiftDate(claim.lossDate, 12);
    claim.policyEnd = shiftDate(claim.lossDate, 377);
  }
  if (failed.has(4) && same(claim.claimant, claim.policyholder)) {
    claim.policyholder = 'Other listed driver';
  }
  if (failed.has(5)) {
    const next = same(claim.vehicleColour, 'White') ? 'Red' : 'White';
    if (same(claim.policyColour, claim.vehicleColour)) claim.policyColour = next;
  }
  if (failed.has(6) && claim.lossDate) {
    claim.policyStart = shiftDate(claim.lossDate, -5);
  }
  if (failed.has(8) && claim.filedAt) {
    const delay = daysBetweenSeed(claim.lossDate, claim.filedAt);
    if (delay <= 14) claim.lossDate = shiftDate(claim.filedAt, -22);
  }
  if (failed.has(10)) {
    claim.garage = 'Al Noor Body Shop';
  }
  if (failed.has(14) && claim.amount != null) {
    claim.sumInsured = Math.round(Number(claim.amount) * 0.45);
  }
  return claim;
}

function daysBetweenSeed(fromIso, toIso) {
  if (!fromIso || !toIso) return 0;
  const a = new Date(`${fromIso}T12:00:00`);
  const b = new Date(`${toIso}T12:00:00`);
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

function pad2(n) {
  return String(n).padStart(2, '0');
}

function formatAuditAmount(amount) {
  return `AED ${Number(amount).toLocaleString('en-US')}`;
}

function nextAuditStamp() {
  const seq = (nextAuditStamp.seq = (nextAuditStamp.seq || 0) + 1);
  const mins = 15 + seq;
  return { date: '2026-08-14', time: `${pad2(16 + Math.floor(mins / 60))}:${pad2(mins % 60)}` };
}

const MAX_CLAIM_VERSIONS = 6;
const STAGE_FLOW = ['fnol', 'intimation', 'assessment', 'settlement'];

function formatUseCaseCode(id) {
  return `UC${Number(id)}`;
}

function formatClaimVersionLabel(index) {
  return `V${Number(index)}`;
}

function sortVersionsChronological(rows) {
  return [...(rows || [])].sort((a, b) => {
    const byWhen = `${a.date}T${a.time || '00:00'}`.localeCompare(`${b.date}T${b.time || '00:00'}`);
    if (byWhen) return byWhen;
    return String(a.version || '').localeCompare(String(b.version || ''));
  });
}

function decorateVersion(row, claim, index) {
  return {
    status: 'Completed',
    comments: row.comments || '',
    oldValue: row.oldValue ?? '—',
    newValue: row.newValue ?? '—',
    entity: row.entity || 'Claim',
    field: row.field || '—',
    action: row.action || 'Updated',
    changeType: row.changeType || 'Update',
    summary: row.summary || row.comments || row.action || 'Updated',
    changes:
      row.changes && row.changes.length
        ? row.changes
        : [
            {
              field: row.field || row.action || 'Change',
              oldValue: row.oldValue ?? '—',
              newValue: row.newValue ?? '—',
            },
          ],
    ...row,
    user:
      !row.user || row.user === 'Claim Intel'
        ? claim.assignedName || 'Fatima Al-Najjar'
        : row.user,
    version: formatClaimVersionLabel(index),
    fnolNumber: row.fnolNumber || claim.fnolNumber || claim.id.replace(/^CLM-/, 'FNOL-'),
    registrationNo: row.registrationNo || claim.id,
    stage: row.stage || 'fnol',
  };
}

function capClaimVersions(rows, claim) {
  const sorted = sortVersionsChronological(rows);
  const kept =
    sorted.length <= MAX_CLAIM_VERSIONS ? sorted : [sorted[0], ...sorted.slice(-(MAX_CLAIM_VERSIONS - 1))];
  return kept.map((row, i) => decorateVersion(row, claim, i));
}

function docChange(row) {
  const statusLabel =
    row.displayStatus === 'waived'

        ? 'Already on file'
        : row.rec.filename || 'Uploaded';
  return {
    field: row.def.name,
    oldValue: 'Missing',
    newValue: statusLabel,
  };
}

    const byWhen = `${a.date}T${a.time || '00:00'}`.localeCompare(`${b.date}T${b.time || '00:00'}`);
    if (byWhen) return byWhen;
    return parseInt(String(a.version).replace(/\D/g, '') || '0', 10) - parseInt(String(b.version).replace(/\D/g, '') || '0', 10);
  });
}

}

function findClaimVersion(claim, versionId) {
  return getClaimVersions(claim).find((row) => String(row.version) === String(versionId)) || null;
}

function useCaseScoresForVersion(claim, version) {
  const stage = version?.stage || 'fnol';
  const maxIdx = Math.max(0, STAGE_FLOW.indexOf(stage));
  const results = claim.results || [];
  const versionTouchedBypass = /bypass/i.test(`${version?.action || ''} ${version?.summary || ''} ${version?.comments || ''}`);
  const source = results.length
    ? results.filter((r) => STAGE_FLOW.indexOf(r.stage) <= maxIdx)
    : USE_CASE_LIBRARY.filter((d) => STAGE_FLOW.indexOf(d.stage) <= maxIdx).map((d) => ({
        checkId: d.id,
        name: d.name,
        stage: d.stage,
        hardFail: isCriticalUseCase(d),
        weight: d.weight,
        state: (claim.checks || []).find((c) => c.checkId === d.id)?.state || 'pass',
        evidence: (claim.checks || []).find((c) => c.checkId === d.id)?.evidence || '',
      }));

  return source.map((r) => {
    let state = r.state;
    if (!versionTouchedBypass && state === 'bypassed') state = 'fail';
    return {
      checkId: r.checkId,
      code: formatUseCaseCode(r.checkId),
      name: r.name,
      state,
      hardFail: !!r.hardFail,
      weight: r.displayWeight ?? r.weight ?? 0,
      stage: r.stage,
      stageName: stageDisplayName(r.stage),
      evidence: r.evidence || '',
    };
  });
}

function appendClaimAudit(claimId, partial) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return;
  const stamp = nextAuditStamp();
  const row = {
    date: stamp.date,
    time: stamp.time,
    user: 'Demo user',
    action: 'Updated',
    changeType: 'Update',
    entity: 'Claim',
    field: '—',
    oldValue: '—',
    newValue: '—',
    status: 'Completed',
    comments: '',
    stage: getClaimWorkflowStage(claim),
    ...partial,
  };
  row.summary = partial.summary || partial.comments || partial.action || 'Updated';
  row.changes =
    partial.changes && partial.changes.length
      ? partial.changes
      : [{ field: row.field, oldValue: row.oldValue, newValue: row.newValue }];
  claim.versions = capClaimVersions([...(claim.versions || claim.auditLog || []), row], claim);
  claim.auditLog = claim.versions;
}

function persistClaimRuntime(claim) {
  const store = loadRuntimeStore();
  const fields = {};
  RUNTIME_FIELDS.forEach((key) => {
    if (claim[key] != null) fields[key] = claim[key];
  });
  store.claims[claim.id] = {
    fields,
    exceptions: claim.exceptions || [],
    waivedCheckIds: claim.waivedCheckIds || [],
    bypassedCheckIds: claim.bypassedCheckIds || [],
    dispositions: claim.dispositions || {},
    versions: claim.versions || claim.auditLog || [],
  };
  localStorage.setItem(CLAIM_RUNTIME_KEY, JSON.stringify(store));
}

function hydrateClaimRuntime() {
  const store = loadRuntimeStore();
  RAW_CLAIMS.forEach((claim) => {
    const slice = store.claims[claim.id];
    if (!slice) return;
    Object.assign(claim, slice.fields || {});
    if (slice.fields?.vehicleMake || slice.fields?.vehicleColour) {
      claim.vehicle = composeVehicle(claim);
    }
    claim.exceptions = slice.exceptions || [];
    claim.waivedCheckIds = slice.waivedCheckIds || [];
    claim.bypassedCheckIds = slice.bypassedCheckIds || [];
    claim.dispositions = slice.dispositions || {};
    if (Array.isArray(slice.versions) && slice.versions.length) {
      claim.versions = capClaimVersions(slice.versions, claim);
      claim.auditLog = claim.versions;
    }
    if (settleCoreBypasses(claim)) persistClaimRuntime(claim);
  });
}

  Object.entries(proposed).forEach(([key, value]) => {
    claim[key] = NUMBER_FIELDS.has(key) ? Number(value) : value;

  if (
    proposed.vehicleMake != null ||

function settleCoreBypasses(claim) {
  let changed = false;
  const ids = new Set(claim.bypassedCheckIds || []);
  (claim.exceptions || []).forEach((ex) => {
    if (ex.type === 'bypass' && ex.status === 'approved' && !ids.has(ex.checkId)) {
      ids.add(ex.checkId);
      changed = true;
    }
  });
  claim.bypassedCheckIds = [...ids];
  return changed;
}

/**
 * Request Bypass notifies the core system (out of scope). Scoring does not change
 * until core approves; the use-case stays Failed with status In approval.
 */
function requestCoreBypass(claimId, checkId, actor) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return { ok: false, message: 'Claim not found.' };
  const id = Number(checkId);
  if ((claim.bypassedCheckIds || []).includes(id)) {
    return { ok: false, message: 'This use-case is already bypassed.' };
  }
  const existing = latestExceptionForCheck(claim, id);
  if (existing?.type === 'bypass' && existing.status === 'pending') {
    return { ok: false, message: 'A bypass request is already in approval with the core system.' };
  }

  const stamp = nextAuditStamp();
  const exception = {
    id: `ex-${claim.id}-${(claim.exceptions || []).length + 1}`,
    checkId: id,
    type: 'bypass',
    status: 'pending',
    comment: 'Bypass requested — waiting for core system approval.',
    proposedFields: {},
    previousFields: {},
    hardFail: false,
    disposition: null,
    requestedBy: actorSnapshot(actor),
    requestedAt: stamp.date,
    decidedBy: null,
    decidedAt: null,
    decisionComment: '',
  };
  claim.exceptions = claim.exceptions || [];
  claim.exceptions.push(exception);
  persistClaimRuntime(claim);

  appendClaimAudit(claimId, {
    user: actor?.name || 'Demo user',
    action: 'Bypass requested',
    changeType: 'Bypass',
    entity: 'Use-case',
    field: checkCode(id),
    oldValue: 'Fail',
    newValue: 'In approval',
    summary: `${checkCode(id)} bypass requested; waiting for core approval.`,
    comments: 'Sent to the core system. Scoring is unchanged until core approves.',
    changes: [{ field: checkCode(id), oldValue: 'Fail', newValue: 'In approval' }],
  });
  persistClaimRuntime(claim);
  return {
    ok: true,
    message:
      'Bypass requested. This use-case is In approval until the core system approves. Scoring stays unchanged until then.',
  };
}

function fieldSummary(fields = {}) {
  const parts = Object.entries(fields).map(([k, v]) => `${k}=${v}`);

function proposeCheckException(claimId, payload, actor) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return { ok: false, message: 'Claim not found.' };
  const checkId = Number(payload.checkId);
  const type = payload.type;
  const comment = String(payload.comment || '').trim();
  if (!['resolve', 'reject', 'approve', 'bypass'].includes(type)) {
    return { ok: false, message: 'Unknown exception action.' };
  }
  if (!comment) return { ok: false, message: 'A comment is required.' };

  const pending = latestExceptionForCheck(claim, checkId);
  if (pending?.status === 'pending') {
    return { ok: false, message: 'This check already has a pending exception.' };
  }

  const hardFail = !!payload.hardFail;
  if (type === 'reject' && hardFail && actor?.role === 'claim_user') {
    return { ok: false, message: 'Claim Users cannot bypass a hard-fail. Resolve the data or refer to FIU.' };
  }
  if (type === 'reject' && hardFail && !isCheckerRole(actor?.role)) {
    return { ok: false, message: 'Only Claim Head or FIU can bypass a hard-fail.' };
  }

  const proposedFields = type === 'resolve' ? { ...(payload.proposedFields || {}) } : {};
  if (type === 'resolve') {
    const allowed = new Set(getExceptionFields(checkId).map((f) => f.key));
    Object.keys(proposedFields).forEach((key) => {
      if (!allowed.has(key)) delete proposedFields[key];
    });
  }

  const previousFields = {};
  Object.keys(proposedFields).forEach((key) => {
    previousFields[key] = claim[key] ?? '—';
  });

  const exception = {
    id: `ex-${claim.id}-${(claim.exceptions || []).length + 1}`,
    checkId,
    type,
    status: 'pending',
    comment,
    proposedFields,
    previousFields,
    hardFail,
    disposition: type === 'approve' ? (hardFail ? 'refer' : 'continue') : null,
    requestedBy: actorSnapshot(actor),
    requestedAt: '2026-08-14',
    decidedBy: null,
    decidedAt: null,
    decisionComment: '',
  };
  claim.exceptions = claim.exceptions || [];
  claim.exceptions.push(exception);
  persistClaimRuntime(claim);

  const actionLabel =
    type === 'resolve'
      ? 'Exception resolve'
      : type === 'reject'
        ? 'Exception reject'
        : type === 'bypass'
          ? 'Bypass requested'
          : 'Exception approve';
  appendClaimAudit(claimId, {
    user: actor?.name || 'Demo user',
    action: actionLabel,
    changeType: 'Exception',
    entity: 'Use-case',
    field: checkCode(checkId),
    oldValue: type === 'resolve' ? fieldSummary(previousFields) : 'Active fail',
    newValue:
      type === 'resolve'
        ? fieldSummary(proposedFields)
        : type === 'reject'
          ? 'Pending bypass'
          : type === 'bypass'
            ? 'Pending bypass'
            : exception.disposition,
    comments: comment,
  });
  persistClaimRuntime(claim);
  return { ok: true, exception };
}

function decideCheckException(claimId, exceptionId, decision, comment, actor) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return { ok: false, message: 'Claim not found.' };
  if (!isCheckerRole(actor?.role)) {
    return { ok: false, message: 'Only Claim Head, Admin, or FIU can decide an exception.' };
  }
  const exception = (claim.exceptions || []).find((e) => e.id === exceptionId);
  if (!exception || exception.status !== 'pending') {
    return { ok: false, message: 'No pending exception found.' };
  }
  const actorId = actor?.userId || actor?.id;
  if (actorId && exception.requestedBy?.userId && actorId === exception.requestedBy.userId) {
    return { ok: false, message: 'Maker cannot approve their own request.' };
  }
  if (decision === 'sent_back') {
    const note = String(comment || '').trim();
    if (!note) return { ok: false, message: 'A comment is required to send back.' };
    exception.status = 'sent_back';
    exception.decisionComment = note;
    exception.decidedBy = actorSnapshot(actor);
    exception.decidedAt = '2026-08-14';
    persistClaimRuntime(claim);
    appendClaimAudit(claimId, {
      user: actor?.name || 'Demo user',
      action: 'Exception sent back',
      changeType: 'Exception',
      entity: 'Use-case',
      field: checkCode(exception.checkId),
      oldValue: 'Pending',
      newValue: 'Sent back',
      comments: note,
    });
    persistClaimRuntime(claim);
    return { ok: true, exception };
  }
  if (decision !== 'approved') return { ok: false, message: 'Unknown decision.' };

  exception.status = 'approved';
  exception.decisionComment = String(comment || '').trim();
  exception.decidedBy = actorSnapshot(actor);
  exception.decidedAt = '2026-08-14';

  if (exception.type === 'resolve') {
    applyProposedFields(claim, exception.proposedFields);
  } else if (exception.type === 'reject') {
    const ids = new Set(claim.waivedCheckIds || []);
    ids.add(exception.checkId);
    claim.waivedCheckIds = [...ids];
  } else if (exception.type === 'bypass') {
    const ids = new Set(claim.bypassedCheckIds || []);
    ids.add(exception.checkId);
    claim.bypassedCheckIds = [...ids];
  } else if (exception.type === 'approve') {
    claim.dispositions = { ...(claim.dispositions || {}), [exception.checkId]: exception.disposition };
  }
  persistClaimRuntime(claim);
  appendClaimAudit(claimId, {
    user: actor?.name || 'Demo user',
    action: 'Exception approved',
    changeType: 'Exception',
    entity: 'Use-case',
    field: checkCode(exception.checkId),
    oldValue:
      exception.type === 'resolve'
        ? fieldSummary(exception.previousFields)
        : exception.type === 'reject' || exception.type === 'bypass'
          ? 'Fail'
          : 'Fail',
    newValue:
      exception.type === 'resolve'
        ? fieldSummary(exception.proposedFields)
        : exception.type === 'reject'
          ? 'Bypassed'
          : exception.type === 'bypass'
            ? 'Bypassed'
          : exception.disposition === 'refer'
            ? 'Refer to FIU'
            : 'Accept risk',
    comments: exception.decisionComment || exception.comment,
  });
  persistClaimRuntime(claim);
  return { ok: true, exception };
}

  if (version.endDate && version.endDate < asOf) return false;

function getVersionForDate(asOf = CONFIG_TODAY, store = getConfigStore()) {
  const covering = store.versions
    .filter((v) => versionCoversDate(v, asOf))
    .sort((a, b) => a.number - b.number);
  if (covering.length) return covering[covering.length - 1];

  const started = store.versions
    .filter((v) => v.startDate && v.startDate <= asOf)
    .sort((a, b) => a.number - b.number);
  if (started.length) return started[started.length - 1];

  return store.versions.find((v) => v.id === store.currentId) || store.versions[store.versions.length - 1];

function commitConfigChange(nextUseCases, dates = {}, extras = {}) {
  const store = getConfigStore();
  const current = getCurrentConfigVersion(store);
  const startDate = dates.startDate || CONFIG_TODAY;
  const endDate = dates.endDate || null;

  // Close any open/overlapping versions that start before the new one.
  store.versions.forEach((v) => {
    if (v.startDate < startDate && (!v.endDate || v.endDate >= startDate)) {
      v.endDate = dayBefore(startDate);
    }
  });

  const newNumber = Math.max(...store.versions.map((v) => v.number)) + 1;
  const newVersion = withVersionExtras({
    id: Math.max(...store.versions.map((v) => v.id)) + 1,
    number: newNumber,
    startDate,
    endDate,
    useCases: cloneUseCases(nextUseCases),
    stagePassPct: extras.stagePassPct || current.stagePassPct,
    stageMix: extras.stageMix || current.stageMix,
  });

  store.versions.push(newVersion);
  store.currentId = getVersionForDate(CONFIG_TODAY, store).id;
  persistConfig(store);
  appendConfigAudit({
    field: extras.summary || 'Scoring configuration',
    oldValue: `Version ${current.number}`,
    newValue: `Version ${newNumber}`,
    comments: extras.reason || `Published scoring version ${newNumber} (${startDate} – ${endDate || 'Present'}).`,

function normField(value) {
  return String(value || '')
    .trim()
    .toLowerCase()
    .replace(/\s+/g, ' ');
}

function evaluateCheckFromFields(claim, checkId, seeded) {
  switch (checkId) {
    case 1: {
      if (!claim.plate || !claim.policyPlate) return seeded;
      const match = normField(claim.plate) === normField(claim.policyPlate);
      return match
        ? { state: 'pass', evidence: `Claim plate ${claim.plate} matches policy plate ${claim.policyPlate}.` }
        : { state: 'fail', evidence: `Policy plate ${claim.policyPlate} vs claim plate ${claim.plate}` };
    }
    case 2: {
      if (!claim.vin || !claim.policyVin) return seeded;
      const match = normField(claim.vin) === normField(claim.policyVin);
      return match
        ? { state: 'pass', evidence: `VIN ${claim.vin} matches the policy chassis record.` }
        : { state: 'fail', evidence: `Policy VIN ${claim.policyVin} vs claim VIN ${claim.vin}` };
    }
    case 3: {
      if (!claim.lossDate || !claim.policyStart || !claim.policyEnd) return seeded;
      const inForce = claim.lossDate >= claim.policyStart && claim.lossDate <= claim.policyEnd;
      return inForce
        ? { state: 'pass', evidence: `Policy ${claim.policyNumber} in force on ${claim.lossDate}.` }
        : {
            state: 'fail',
            evidence: `Loss date ${claim.lossDate} is outside policy ${claim.policyNumber} (${claim.policyStart} – ${claim.policyEnd}).`,
          };
    }
    case 4: {
      if (!claim.claimant || !claim.policyholder) return seeded;
      const match = normField(claim.claimant) === normField(claim.policyholder);
      return match
        ? { state: 'pass', evidence: `${claim.claimant} matches the policyholder / endorsed driver.` }
        : {
            state: 'fail',
            evidence: `Claimant ${claim.claimant} is not the policyholder ${claim.policyholder}.`,
          };
    }
    case 5: {
      const claimSpec = [claim.vehicleMake, claim.vehicleModel, claim.vehicleColour].filter(Boolean).join(' ');
      const policySpec = [claim.policyMake, claim.policyModel, claim.policyColour].filter(Boolean).join(' ');
      if (!claimSpec || !policySpec) return seeded;
      const match =
        normField(claim.vehicleMake) === normField(claim.policyMake) &&
        normField(claim.vehicleModel) === normField(claim.policyModel) &&
        normField(claim.vehicleColour) === normField(claim.policyColour);
      return match
        ? { state: 'pass', evidence: `Vehicle ${claimSpec} matches the policy schedule.` }
        : { state: 'fail', evidence: `Policy: ${policySpec} · Claim: ${claimSpec}` };
    }
    case 6: {
      if (!claim.lossDate || !claim.policyStart) return seeded;
      const days = daysBetween(claim.policyStart, claim.lossDate);
      return days >= 14
        ? { state: 'pass', evidence: `Loss is ${days} days after policy inception.` }
        : { state: 'fail', evidence: `Loss ${days} days after policy inception (minimum cover: 14 days)` };
    }
    case 8: {
      if (!claim.lossDate || !claim.filedAt) return seeded;
      const days = daysBetween(claim.lossDate, claim.filedAt);
      return days <= 14
        ? { state: 'pass', evidence: `Reported within ${days} day${days === 1 ? '' : 's'} of loss.` }
        : { state: 'fail', evidence: `Reported ${days} days after date of loss` };
    }
    case 14: {
      if (claim.amount == null || claim.sumInsured == null) return seeded;
      return claim.amount <= claim.sumInsured
        ? { state: 'pass', evidence: `Claim ${claim.amount} is within IDV ${claim.sumInsured}.` }
        : {
            state: 'fail',
            evidence: `Claim AED ${Number(claim.amount).toLocaleString('en-US')} exceeds IDV AED ${Number(claim.sumInsured).toLocaleString('en-US')}.`,

/** Remaining non-critical use-cases in a stage share 100%. Criticals are pass/fail gates. */
function attachNormalizedWeights(results) {
  CLAIM_STAGES.forEach((stage) => {
    const stageRows = results.filter((r) => r.stage === stage.id);
    const live = stageRows.filter(isWeightPoolRow);
    const total = live.reduce((sum, r) => sum + (Number(r.weight) || 0), 0);
    live.forEach((r) => {
      r.configuredWeight = Number(r.weight) || 0;
      r.displayWeight = total ? Math.round((r.configuredWeight / total) * 100) : 0;
    });
    const shown = live.reduce((sum, r) => sum + r.displayWeight, 0);
    if (live.length && shown !== 100) {
      const richest = live.reduce((a, b) => (b.displayWeight >= a.displayWeight ? b : a));
      richest.displayWeight += 100 - shown;
    }
    stageRows
      .filter((r) => !isWeightPoolRow(r))
      .forEach((r) => {
        r.configuredWeight = Number(r.weight) || 0;
        r.displayWeight = 0;

function scoreWeight(r) {

  const activeWeight = evaluable.reduce((sum, r) => sum + scoreWeight(r), 0);
  const earnedWeight = passed.reduce((sum, r) => sum + scoreWeight(r), 0);

  if (activeWeight === 0) {
    return { score: 0, tier: 'red', activeWeight: 0, earnedWeight: 0, evaluable: 0 };
  }
  const score = Math.round((earnedWeight / activeWeight) * 100);
  return {
    score: Math.min(100, Math.max(0, score)),
    tier: scoreBand(score),
    activeWeight,
    earnedWeight,
    evaluable: evaluable.length,
  };

    .filter((c) => activeIds.has(c.checkId))

      let evidence = evaluated.evidence;
      if (bypassedIds.has(c.checkId)) {

        name: meta?.name || def.name,

        description: meta?.description || def.description,
        category: def.category,
        stage: meta?.stage || def.stage,
        riskCategory: meta?.riskCategory || def.riskCategory,

        bypassed: state === 'bypassed',
        waived: false,

      softFailCount: stageResults.filter((r) => !r.hardFail && r.state === 'fail').length,
      failCount: stageResults.filter((r) => r.state === 'fail').length,

      checkCount: stageResults.length,
      passMark: mark,

function csvEscape(value) {
  const s = String(value ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function escHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function triggerDownload(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadCsv(filename, rows) {
  const csv = rows.map((r) => r.map(csvEscape).join(',')).join('\n');
  triggerDownload(filename, new Blob([csv], { type: 'text/csv;charset=utf-8' }));
}

function downloadXls(filename, rows) {
  const table = rows
    .map((r) => `<tr>${r.map((c) => `<td>${escHtml(c)}</td>`).join('')}</tr>`)
    .join('');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table>${table}</table></body></html>`;
  const name = filename.toLowerCase().endsWith('.xls') ? filename : `${filename}.xls`;
  triggerDownload(name, new Blob([html], { type: 'application/vnd.ms-excel' }));
}

function downloadPdf(title, bodyHtml) {
  const w = window.open('', '_blank', 'noopener,noreferrer');
  if (!w) return;
  w.document.write(`<!DOCTYPE html><html><head><title>${escHtml(title)}</title>
    <style>
      body { font-family: "Poppins", system-ui, sans-serif; color: #16303d; padding: 28px; }
      h1 { font-size: 1.25rem; margin: 0 0 6px; }
      p { color: #6b7f8a; font-size: 0.85rem; margin: 0 0 16px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #d5e8df; padding: 7px 8px; text-align: left; font-size: 12px; }
      th { background: #e8fff6; }
    </style>
  </head><body>${bodyHtml}</body></html>`);
  w.document.close();
  w.focus();
  w.print();
}

        Export ${iconCaretDown()}
      </button>

        <button type="button" data-export-fmt="csv">Export in CSV</button>
        <button type="button" data-export-fmt="xls">Export in XLS</button>

      </div>
