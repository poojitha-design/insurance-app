}

function bindExportMenus(root, handlers = {}) {
  const closeAll = () => {
    root.querySelectorAll('[data-export-menu]').forEach((menu) => {
      const panel = menu.querySelector('.export-menu-panel');
      const toggle = menu.querySelector('[data-export-toggle]');
      if (panel) panel.hidden = true;
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
      menu.classList.remove('is-open');
    });
  };
  root.querySelectorAll('[data-export-toggle]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const menu = btn.closest('[data-export-menu]');
      const panel = menu?.querySelector('.export-menu-panel');
      if (!panel) return;
      const open = panel.hidden;
      closeAll();
      panel.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      menu.classList.toggle('is-open', open);
    });
  });
  root.querySelectorAll('[data-export-fmt]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = btn.closest('[data-export-menu]')?.dataset.exportMenu;
      const fn = handlers[id]?.[btn.dataset.exportFmt];
      closeAll();
      if (typeof fn === 'function') fn();
    });
  });
  document.addEventListener('click', closeAll, { once: true });
}

function bindDialogDismiss(root, onClose) {
  root._dialogAbort?.abort();
  if (typeof onClose !== 'function') return;
  const dialog = root.querySelector('[role="dialog"]');
  if (!dialog) return;
  const ac = new AbortController();
  root._dialogAbort = ac;
  document.addEventListener(
    'keydown',
    (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        onClose();
      }
    },
    { signal: ac.signal }
  );
  const focusable = dialog.querySelector(
    'button, [href], input:not([type="hidden"]), select, textarea, [tabindex]:not([tabindex="-1"])'
  );
  focusable?.focus();
}

function sparklineSvg(values, { stroke = '#2EDB8E', fill = 'rgba(46, 219, 142, 0.18)' } = {}) {
  const nums = (values || []).map(Number).filter((n) => Number.isFinite(n));
  if (nums.length < 2) return '';
  const w = 140;
  const h = 44;
  const pad = 3;
  const min = Math.min(...nums);
  const max = Math.max(...nums);
  const span = max - min || 1;
  const pts = nums.map((v, i) => {

  const area = `${pad},${h - pad} ${line} ${w - pad},${h - pad}`;
  return `<svg class="ov-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="${area}" fill="${fill}"/><polyline points="${line}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  const next = routeAfterLogin(user);
  if ((location.hash || '#/login') === next) {
    window.dispatchEvent(new HashChangeEvent('hashchange'));
  } else {
    location.hash = next;
  }
  return true;
}

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function claimTypeLabel(claim) {
  return CLAIM_TYPE_LABELS[claim.claimType] || claim.claimType || 'Own damage';
}

function claimTypeTitle(claim) {
  return claimTypeLabel(claim).replace(/\b[a-z]/g, (ch) => ch.toUpperCase());
}

function headerAmount(claim) {
  const n = Number(claim.amount);
  if (!Number.isFinite(n)) return '—';
  return `AED ${n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}

function vehicleLine(claim) {
  return String(claim.vehicle || '—')
    .replace(/\s+\d{4}\b/, '')
    .replace(/\s*·\s*/g, ' - ');
}

function scoreOutcome(source) {
  if (!source) return '';
  if (source.forcedRed || source.criticalFailed) return 'Fail';
  if (source.tier === 'red') return 'High';
  if (source.tier === 'yellow') return 'Low';
  return 'Pass';
}

function stageScoreLine(stageScore) {
  if (!stageScore) return 'Not scored';
  const outcome = scoreOutcome(stageScore);
  if (outcome === 'Fail') return 'Fail';
  return `${formatScore(stageScore.score)} ${outcome}`;
}

function weightCellHtml(r, stageHasExcluded) {
  if (r.state === 'bypassed' || r.state === 'waived') {
    return `<span class="check-weight-excluded" title="Excluded from this stage’s score">—</span>`;
  }
  if (r.hardFail) {
    return `<span class="check-weight-gate" title="Critical use-cases are pass / fail only">Pass / fail</span>`;
  }
  const shown = r.displayWeight ?? r.weight ?? 0;
  const configured = r.configuredWeight ?? r.weight ?? 0;
  if (stageHasExcluded && shown !== configured) {
    return `${shown}% <span class="check-weight-was">was ${configured}%</span>`;
  }
  return `${shown}%`;
}

function exceptionBlockHtml(result, session, claim) {
  if (session.role === 'surveyor') return '';
  const bits = [];
  const pending = latestExceptionForCheck(claim, result.checkId);
  const awaitingCore = pending?.type === 'bypass' && pending.status === 'pending';
  if (result.state === 'bypassed') {
    bits.push(`<span class="tag override">Bypassed</span>`);
    bits.push(
      session.role === 'claim_user'
        ? `<p class="exception-note">Excluded from this stage.</p>`
        : `<p class="exception-note">Excluded from this stage. Remaining use-case weights are normalised to 100%.</p>`
    );
  } else if (awaitingCore) {
    bits.push(`<span class="tag pending">In approval</span>`);
    bits.push(
      `<p class="exception-note">Bypass requested. Waiting for the core system to approve. Scoring is unchanged until then.</p>`
    );
  }
  const buttons = [];
  if (result.state === 'fail' && !awaitingCore) {
    buttons.push(
      `<button type="button" class="btn btn-sm btn-primary" data-action="request-bypass" data-check-id="${result.checkId}">Request Bypass</button>`
    );
  }
  if (!bits.length && !buttons.length) return '';
  return `
    <div class="exception-block">
      ${bits.join('')}
      ${buttons.length ? `<div class="exception-actions">${buttons.join('')}</div>` : ''}
    </div>
  `;
}

function requiredTag(def) {
  if (def.required === 'optional') return `<span class="tag doc-optional">Optional</span>`;
  if (def.required === 'conditional') return `<span class="tag doc-conditional">Conditional</span>`;
  return `<span class="tag doc-required">Required</span>`;
}

function docStatusLabel(status) {
  if (status === 'uploaded' || status === 'already_on_file' || status === 'waived' || status === 'bypassed') {
    return 'View';
  }
  return 'Missing';
}

function isDocOnFile(status) {
  return status === 'uploaded' || status === 'already_on_file' || status === 'waived' || status === 'bypassed';
}

function documentListHtml(claim, stageId) {
  const rows = getStageDocumentRows(claim, stageId);
  if (!rows.length) return `<p class="cd-empty">No documents requested for this stage.</p>`;
  return `
    <ul class="cd-doclist">
      ${rows
        .map((row) => {
          const onFile = isDocOnFile(row.displayStatus);
          return `
            <li class="cd-docitem ${onFile ? 'is-view' : 'is-missing'}">
              <span class="cd-doccheck" aria-hidden="true">${onFile ? iconCheck() : ''}</span>
              <span class="cd-docname">${esc(row.def.name)}</span>
              ${requiredTag(row.def)}
              <span class="cd-docstatus">${docStatusLabel(row.displayStatus)}</span>
            </li>`;
        })
        .join('')}
    </ul>
  `;
}

function stageHoldMessage(claim, stageId) {
  const scored = (claim.stageScores || []).some((s) => s.stageId === stageId);
  if (scored) return '';
  const heldName = stageDisplayName(claim.heldAtStage || claim.workflowStage);
  if (claim.holdReason === 'critical') {
    return `This stage is not scored. A critical use-case failed at ${heldName}. The claim cannot move on unless that check is bypassed and approved.`;
  }
  if (claim.holdReason === 'docs') {
    return `This stage is not scored until required ${heldName} documents are on file.`;
  }
  if (claim.holdReason === 'surveyor') {
    return `This stage is not scored until Assessment is submitted.`;
  }
  return `This stage is not scored yet. The claim is still at ${heldName}.`;
}

function metaRow(label, value) {
  return `
    <div class="cd-meta-row">
      <span class="cd-meta-label">${label}</span>
      <span class="cd-meta-colon">:</span>
      <span class="cd-meta-value">${value}</span>
    </div>
  `;
}

function iconCopy() {
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
}

function copyField(label, value) {
  const text = String(value || '').trim();
  if (!text) return metaRow(label, '—');
  return metaRow(
    label,
    `<span class="cd-id">
      ${esc(text)}
      <button type="button" class="cd-copy" data-action="copy-id" data-copy="${esc(text)}" title="Copy ${esc(label)}" aria-label="Copy ${esc(label)}">
        ${iconCopy()}
      </button>
    </span>`
  );
}

function copyFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
}

function copyText(text) {
  if (navigator.clipboard?.writeText) {
    return navigator.clipboard.writeText(text).catch(() => copyFallback(text));
  }
  copyFallback(text);
  return Promise.resolve();
}

function partyBlock(title, lines) {
  return `
    <div class="cd-party">
      <h4>${title}</h4>
      ${lines.map((line) => `<p>${line}</p>`).join('')}
    </div>
  `;
}

function stageFilterHtml(stageFilter) {
  const options = [{ id: 'overview', label: 'Overview' }, ...CLAIM_STAGES.map((st) => ({ id: st.id, label: stageDisplayName(st.id) }))];
  return `
    <div class="cd-stepper" role="tablist" aria-label="Claim stage">
      ${options
        .map((opt) => {
          const active = stageFilter === opt.id;
          return `
          <button type="button" class="cd-step${active ? ' is-active' : ''}" data-stage-tab="${opt.id}" role="tab" aria-selected="${active ? 'true' : 'false'}">
            ${opt.label}
          </button>`;
        })
        .join('')}
    </div>
  `;
}

function checksSummary(stageResults) {
  if (!stageResults.length) return '—';
  const pass = stageResults.filter((r) => r.state === 'pass').length;
  const fail = stageResults.filter((r) => r.state === 'fail' || r.state === 'cant_evaluate').length;
  if (fail && pass) return `${pass} passed, ${fail} failed`;
  if (fail) return `${fail} failed`;
  return `${pass} passed`;
}

function needsActionLabel(claim, stage, stageResults, stageScore) {
  const failed = stageResults.find((r) => r.state === 'fail' || r.state === 'cant_evaluate');
  if (failed) return failed.name;
  const docs = getStageDocCompleteness(claim, stage.id);
  if (docs.total && docs.done < docs.total) return 'Documents missing';
  if (!stageScore) return 'Not scored yet';
  return '—';
}

function overviewTableHtml(claim) {
  const rows = CLAIM_STAGES.map((stage) => {
    const stageResults = (claim.results || []).filter((r) => r.stage === stage.id);
    const stageScore = (claim.stageScores || []).find((x) => x.stageId === stage.id);
    const docs = getStageDocCompleteness(claim, stage.id);
    const outcome = stageScore ? scoreOutcome(stageScore) : '';
    const action = needsActionLabel(claim, stage, stageResults, stageScore);
    return `
      <tr data-stage-tab="${stage.id}">
        <td class="sum-stage">${stageDisplayName(stage.id)}</td>
        <td class="sum-score${outcome ? ` is-${outcome.toLowerCase()}` : ''}">${esc(stageScoreLine(stageScore))}</td>
        <td>${esc(checksSummary(stageResults))}</td>
        <td>${docs.total ? `${docs.done}/${docs.total}` : '—'}</td>
        <td class="sum-action${action === '—' ? ' is-clear' : ''}">${esc(action)}</td>
        <td class="sum-open">Open</td>
      </tr>`;
  }).join('');
  return `
    <div class="sum-table-wrap">
      <table class="sum-table">
        <thead>
          <tr>
            <th>Stage</th>
            <th>Score</th>
            <th>Checks</th>
            <th>Documents</th>
            <th>Needs action</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function stageScoringStripHtml(claim, stage) {
  const stageResults = (claim.results || []).filter((r) => r.stage === stage.id);
  const stageScore = (claim.stageScores || []).find((x) => x.stageId === stage.id);
  const pass = stageResults.filter((r) => r.state === 'pass').length;
  const fail = stageResults.filter((r) => r.state === 'fail' || r.state === 'cant_evaluate').length;
  const scored = pass + fail;
  const passPct = scored ? (pass / scored) * 100 : 0;
  const failPct = scored ? (fail / scored) * 100 : 0;
  const outcome = stageScore ? scoreOutcome(stageScore) : 'Not scored';
  return `
    <div class="stage-score">
      <div class="stage-score-top">
        <h2><i aria-hidden="true"></i> ${stageDisplayName(stage.id)} scoring</h2>
        <span class="stage-score-rule" aria-hidden="true"></span>
        <span>Sum insured ${formatAED(claim.sumInsured)}</span>
      </div>
      <p>Claim value ${formatAED(claim.amount)} · ${esc(outcome)}</p>
      <div class="stage-score-bar" aria-hidden="true">
        ${passPct ? `<span class="is-pass" style="width:${passPct}%"></span>` : ''}
        ${failPct ? `<span class="is-fail" style="width:${failPct}%"></span>` : ''}
      </div>
      <div class="stage-score-legend">
        <span><i class="is-pass"></i> Passed ${pass} check${pass === 1 ? '' : 's'}</span>
        <span><i class="is-fail"></i> Failed ${fail}</span>
      </div>
    </div>`;
}

function summaryField(label, valueHtml) {
  return `<div class="cd-field"><span class="cd-field-label">${label}</span><div class="cd-field-value">${valueHtml}</div></div>`;
}

function scoreCardHtml(claim) {
  const stageId = getClaimWorkflowStage(claim);
  const stageScore = (claim.stageScores || []).find((s) => s.stageId === stageId);
  const stageResults = (claim.results || []).filter((r) => r.stage === stageId);
  const pool = stageResults.length ? stageResults : claim.results || [];
  const failed = pool.filter((r) => r.state === 'fail' || r.state === 'cant_evaluate').length;
  const outcome = scoreOutcome(stageScore || claim) || 'Pass';
  const score = stageScore?.criticalFailed ? 0 : Number(stageScore?.score ?? claim.score) || 0;
  const arc = outcome === 'High' || outcome === 'Fail' ? '#F24456' : outcome === 'Low' ? '#E0A100' : '#2ED88E';
  const pct = Math.max(0, Math.min(100, Math.round(score)));
  const note = pool.length ? `${failed} of ${pool.length} checks failed` : 'Not scored yet';
  return `
    <aside class="cd-scorecard">
      <div class="cd-donut" style="--p:${pct};--arc:${arc}" role="img" aria-label="${stageDisplayName(stageId)} score ${pct}%">
        <span>${outcome === 'Fail' ? 'Fail' : `${pct}%`}</span>
      </div>
      <div class="cd-scorecard-copy">
        <h2>${stageDisplayName(stageId)} Score</h2>
        <span class="cd-score-pill is-${outcome.toLowerCase()}">${outcome}</span>
        <p class="cd-score-note">${note}</p>
      </div>
    </aside>`;
}

function checksListHtml(claim, session, stage, items, filter, hideWeights) {
  const stageHasExcluded = (claim.results || []).some(
    (r) => r.stage === stage.id && !r.hardFail && (r.state === 'bypassed' || r.state === 'waived')
  );
  const stageHasCritical = (claim.results || []).some((r) => r.stage === stage.id && r.hardFail);
  const hints = [];
  if (!hideWeights && stageHasCritical) {
    hints.push('Critical use-cases are pass / fail only. If they pass, remaining use-cases in this stage share 100%.');
  }
  if (!hideWeights && stageHasExcluded) {
    hints.push('Bypassed use-cases are excluded. Remaining weights in this stage are normalised to 100%.');
  }
  const holdNote = stageHoldMessage(claim, stage.id);
  return `
    ${holdNote ? `<p class="stage-hold-note">${holdNote}</p>` : ''}
    <div class="checks-list cd-checks">
      ${
        items.length === 0
          ? filter === 'all' || holdNote
            ? holdNote
              ? ''
              : `<div class="empty-checks">No scoring checks for this stage.</div>`
            : `<div class="empty-checks">No checks in this result state.</div>`
          : items
              .map(
                (r) => `
        <div class="check-row ${r.state}${hideWeights ? ' no-weight' : ''}">
          <div class="check-state-icon ${r.state}">${stateIcon(r.state)}</div>
          <div class="check-body">
            <div class="check-name">
              <span class="check-code">${checkCode(r.checkId)}</span>
              ${r.name}
              ${r.hardFail ? `<span class="tag critical">Critical</span>` : ''}
            </div>
            <p class="evidence">${r.evidence}</p>
            ${exceptionBlockHtml(r, session, claim)}
          </div>
          ${hideWeights ? '' : `<div class="check-weight">${weightCellHtml(r, stageHasExcluded)}</div>`}
        </div>
      `
              )
              .join('')
      }
    </div>
    ${hints.map((h) => `<p class="stage-norm-hint">${h}</p>`).join('')}
  `;
}

function surveyorSubmitHtml(claim, surveyorCanWork) {
  if (!surveyorCanWork) return '';
  return `
    <div class="surveyor-submit">
      <p>${
        hasStageDocsComplete(claim, 'assessment')
          ? 'Required Assessment documents are on file. Submit to run further scoring and move this claim to the next stage.'
          : 'Upload every required Assessment document, then submit for further scoring.'
      }</p>
      <button type="button" class="btn btn-primary" data-action="submit-surveyor" ${
        hasStageDocsComplete(claim, 'assessment') ? '' : 'disabled'
      }>Submit for further scoring</button>
    </div>
  `;
}

function renderClaimDetail(
  root,
  session,
  claim,
  filter,
  onFilter,
  { selectedStage = null, exceptionNotice = null, pageTab = 'overview', versionKey = null } = {}
) {
  if (!claim) {
    root.innerHTML = renderShell(
      session,
      '#/queue',
      `<div class="empty-state">Claim not found. <a href="#/queue">Back to claims</a></div>`,
      { mainClass: 'is-claim' }
    );
    root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];
    return;
  }

  const isSurveyor = session.role === 'surveyor';
  const isClaimUser = session.role === 'claim_user';
  const hideAssigned = isClaimUser || isSurveyor;
  const hideWeights = isClaimUser;
  const stageFilter = isSurveyor ? selectedStage || 'assessment' : selectedStage || 'overview';
  const isOverview = stageFilter === 'overview';
  const visibleStages = isOverview ? [] : CLAIM_STAGES.filter((s) => s.id === stageFilter);
  const assessmentVisible = visibleStages.some((s) => s.id === 'assessment');
  const surveyorCanWork =
    isSurveyor &&
    assessmentVisible &&
    hasPassedPriorStages(claim, ['fnol', 'intimation']) &&
    !claim.surveyorSubmitted;
  const surveyorSubmitted = isSurveyor && !!claim.surveyorSubmitted;
  const visibleResults = (claim.results || []).filter((r) => visibleStages.some((s) => s.id === r.stage));
  const counts = {
    all: visibleResults.length,
    pass: visibleResults.filter((r) => r.state === 'pass').length,
    fail: visibleResults.filter((r) => r.state === 'fail' || r.state === 'cant_evaluate').length,
  };
  const hardFailNames = (claim.hardFails || []).map((h) => `${checkCode(h.checkId)} ${h.name}`).join('; ');
  const stageSections = visibleStages
    .map((stage) => {
      const stageResults = (claim.results || []).filter((r) => r.stage === stage.id);
      const sorted = sortChecksForDisplay(stageResults);
      const items =
        filter === 'all'
          ? sorted
          : filter === 'fail'
            ? sorted.filter((r) => r.state === 'fail' || r.state === 'cant_evaluate')
            : sorted.filter((r) => r.state === filter);
      const docs = getStageDocCompleteness(claim, stage.id);
      return `
        <section class="cd-stage-block">
          ${stageScoringStripHtml(claim, stage)}
          <div class="cd-section-head">
            <h3>Scoring checks</h3>
            <div class="result-filters cd-filters">
              <button type="button" class="result-filter ${filter === 'all' ? 'active' : ''}" data-filter="all">All <span class="count">${counts.all}</span></button>
              <button type="button" class="result-filter ${filter === 'pass' ? 'active' : ''}" data-filter="pass">Passed <span class="count">${counts.pass}</span></button>
              <button type="button" class="result-filter ${filter === 'fail' ? 'active' : ''}" data-filter="fail">Failed <span class="count">${counts.fail}</span></button>
            </div>
          </div>
          ${checksListHtml(claim, session, stage, items, filter, hideWeights)}
          <div class="cd-section-head">
            <h3>Documents</h3>
            <span class="cd-onfile">${docs.total ? `${docs.done}/${docs.total} on file` : ''}</span>
          </div>
          ${documentListHtml(claim, stage.id)}
          ${stage.id === 'assessment' ? surveyorSubmitHtml(claim, surveyorCanWork) : ''}
        </section>`;
    })
    .join('');

  const banners = [
    exceptionNotice
      ? `<div class="surveyor-banner"><strong>Bypass requested</strong><p>${esc(exceptionNotice)}</p></div>`
      : '',
    surveyorCanWork
      ? `<div class="surveyor-banner">
          <strong>Assessment stage</strong>
          <p>Review the Assessment documents below, then submit to run further scoring.</p>
        </div>`
      : isSurveyor && assessmentVisible && !surveyorSubmitted
        ? `<div class="surveyor-banner">
            <strong>Assessment stage</strong>
            <p>This claim has not completed FNOL and Registration yet. Submit is available after those stages pass.</p>
          </div>`
        : '',
    surveyorSubmitted
      ? `<div class="surveyor-banner is-done">
          <strong>Submitted for further scoring</strong>
          <p>Surveyor documents are on file. Assessment scoring is now included and the claim has moved to the next stage.</p>
        </div>`
      : '',
    claim.forcedRed
      ? `<div class="hardfail-banner">
          <div class="banner-icon">${iconAlert()}</div>
          <div>
            <strong>Critical use-case failed</strong>
            <p>${hardFailNames}. This stage is Fail and the claim cannot move to the next stage unless the check is bypassed or corrected.</p>
          </div>
        </div>`
      : '',
  ]
    .filter(Boolean)
    .join('');

  const stageBody = isOverview ? overviewTableHtml(claim) : stageSections;

  const content = `
    <div class="cd-crumb">
      <button type="button" class="back-link" data-action="back">${iconBack()} Claims</button>
      <span>/</span>
      <span>Claim details</span>
    </div>

    <article class="cd-card">
      <section class="cd-summary">
        <div class="cd-summary-main">
          <h1>${esc(claimTypeTitle(claim))} - ${esc(claim.claimant)}</h1>
          <div class="cd-summary-grid">
            ${summaryField('Claim Number', `<a class="cd-field-link" href="#/claim/${esc(claim.id)}">${esc(claim.id)}</a>`)}
            ${summaryField('Policy Number', esc(claim.policyNumber || '—'))}
            ${summaryField('Claimant', esc(claim.claimant || '—'))}
            ${summaryField('Claim Amount', esc(headerAmount(claim)))}
            ${summaryField('Assigned to', esc(hideAssigned ? claim.branch || '—' : claim.assignedName || '—'))}
            ${summaryField('Loss Date', formatDate(claim.lossDate))}
            ${summaryField('Vehicle', esc(vehicleLine(claim)))}
            ${summaryField('Claim Type', esc(claimTypeTitle(claim)))}
          </div>
        </div>
        ${scoreCardHtml(claim)}
      </section>
    </article>

    <section class="cd-stage-card">
      ${stageFilterHtml(stageFilter)}
      ${banners}
      <div class="cd-tab-body">
        ${stageBody}
      </div>
    </section>
  `;

  root.innerHTML = renderShell(session, '#/queue', content, { mainClass: 'is-claim' });
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  const persist = (nextFilter, extra = {}) =>
    onFilter(nextFilter, {
      selectedStage: stageFilter,
      exceptionNotice: null,
      pageTab: 'overview',
      versionKey: null,
      ...extra,
    });

  root.querySelector('[data-action="back"]').addEventListener('click', () => {
    location.hash = '#/queue';
  });
  root.querySelectorAll('[data-filter]').forEach((btn) => {
    btn.addEventListener('click', () => persist(btn.dataset.filter));
  });
  root.querySelectorAll('[data-stage-tab]').forEach((btn) => {
    btn.addEventListener('click', () => persist('all', { selectedStage: btn.dataset.stageTab }));
  });
  root.querySelector('[data-action="submit-surveyor"]')?.addEventListener('click', () => {
    const result = submitSurveyorAssessment(claim.id);
    persist(filter, { surveyorMessage: result.message });
  });
  root.querySelectorAll('[data-action="request-bypass"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const result = requestCoreBypass(claim.id, Number(btn.dataset.checkId), session);
      persist(filter, { exceptionNotice: result.message });
    });
  });
  root.querySelectorAll('[data-action="copy-id"]').forEach((btn) => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const text = btn.dataset.copy || '';
      if (!text) return;
      try {
        await copyText(text);
        const original = btn.innerHTML;
        btn.classList.add('is-copied');
        btn.innerHTML = iconCheck();
        btn.setAttribute('aria-label', 'Copied');
        window.setTimeout(() => {
          btn.classList.remove('is-copied');
          btn.innerHTML = original;
          btn.setAttribute('aria-label', btn.title || 'Copy');
        }, 1400);
      } catch {
        /* ignore */
      }
    });
  });
}
  __ns.renderClaimDetail = renderClaimDetail;
})();

function countBy(list, keyFn) {
  const map = new Map();
  list.forEach((c) => {
    const key = keyFn(c) || '—';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(c);
  });
  return [...map.entries()]
    .map(([name, rows]) => ({
      name,
      count: rows.length,
      red: rows.filter((c) => c.tier === 'red' || c.forcedRed).length,
      value: rows.reduce((s, c) => s + (c.amount || 0), 0),
    }))
    .sort((a, b) => b.red - a.red || b.count - a.count);
}

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatCompactAED(amount) {
  const n = Number(amount) || 0;
  if (n >= 1_000_000) return `AED ${(n / 1_000_000).toFixed(1)}M`;
  if (n >= 10_000) return `AED ${Math.round(n / 1000)}k`;
  return formatAED(n);
}

function pctDelta(current, previous) {
  if (previous == null || previous === 0) {
    if (!current) return { dir: 'flat', text: 'No prior period' };
    return { dir: 'up', text: 'New vs last period' };
  }
  const d = ((current - previous) / previous) * 100;
  const dir = d > 0.4 ? 'up' : d < -0.4 ? 'down' : 'flat';
  const sign = d > 0 ? '+' : '';
  return { dir, text: `${sign}${d.toFixed(1)}% vs last period` };
}

function ptsDelta(current, previous) {
  if (previous == null) return { dir: 'flat', text: 'No prior period' };
  const delta = current - previous;
  const dir = delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat';
  const arrow = delta > 0 ? '▲' : delta < 0 ? '▼' : '•';
  return { dir, text: `${arrow} ${Math.abs(delta)} pt${Math.abs(delta) === 1 ? '' : 's'} vs last period` };
}

  return list.map((u) => ({ ...u }));
}

/** @type {{ riskCategory: string, query: string }} */
let filters = { riskCategory: 'all', query: '' };
let scoringTab = 'fnol';
/** @type {number|null} viewing historical version id */
let viewingVersionId = null;
let openMenuId = null;
let modal = null;
let prevVersionsOpen = false;
let feedback = null;
let ucPickerOpen = false;

function getViewVersion() {
  const store = getConfigStore();
  if (viewingVersionId && viewingVersionId !== store.currentId) {
    return getConfigVersionById(viewingVersionId, store);
  }
  return getCurrentConfigVersion(store);
}

function isReadOnly() {
  const store = getConfigStore();
  return viewingVersionId != null && viewingVersionId !== store.currentId;
}

function filteredRows(useCases) {
  return useCases.filter((u) => {
    if (u.stage !== scoringTab) return false;
    if (filters.riskCategory !== 'all' && u.riskCategory !== filters.riskCategory) return false;
    if (filters.query) {
      const q = filters.query.toLowerCase();
      const blob = `${u.code} ${u.name} ${u.description}`.toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function defaultVersionDates() {
  return { startDate: '', endDate: '' };
}

function readVersionDates(root) {
  const startDate = root.querySelector('#modal-start-date')?.value || '';
  const endRaw = root.querySelector('#modal-end-date')?.value || '';
  return {
    startDate,
    endDate: endRaw || null,
  };
}

function validateVersionDates(dates) {
  if (!dates.startDate) return 'Please select a start date for the new version.';
  if (!dates.endDate) return 'Please select an end date for the new version.';
  if (dates.endDate < dates.startDate) {
    return 'End date must be on or after the start date.';
  }
  return null;
}

function hasCompleteVersionDates(draft = {}) {
  return !!(draft.startDate && draft.endDate && draft.endDate >= draft.startDate);
}

function applyMutation(mutator, dates, extras = {}) {
  const store = getConfigStore();
  const current = getCurrentConfigVersion(store);
  const next = mutator(cloneUseCases(current.useCases));
  const result = commitConfigChange(next, dates, extras);
  const created = result.versions[result.versions.length - 1];
  viewingVersionId = null;
  const endLabel = created.endDate ? formatLongDate(created.endDate) : 'Present';
  const when = isFutureVersion(created) ? 'scheduled' : 'created';
  feedback = {
    type: 'success',
    message: `Version ${created.number} ${when} (${formatLongDate(created.startDate)} – ${endLabel}).`,
  };
}

function versionNoticeHtml() {
  return `
    <div class="version-notice" role="status">
      Your changes will be saved as a new version. Select the start date and end date for this new version to continue.
    </div>
  `;
}

function versionDateFieldsHtml(draft = {}, { disabled = false } = {}) {
  const start = draft.startDate || '';
  const end = draft.endDate || '';
  const err = draft.dateError ? `<p class="version-dates-error">${draft.dateError}</p>` : '';
  const hint = disabled
    ? 'Select an available use-case to enable the from and to dates.'
    : 'Both dates are required before the use-case can be added. Use a future start date to schedule this version.';
  return `
    <div class="version-dates-block${disabled ? ' is-disabled' : ''}">
      <div class="version-dates-title">From and to dates</div>
      <p class="version-dates-hint">${hint}</p>
      <div class="field-row field-row-2">
        <div class="field">
          <label for="modal-start-date">From date <span class="required-mark">*</span></label>
          <input type="date" id="modal-start-date" value="${start}" required ${disabled ? 'disabled' : ''} />
        </div>
        <div class="field">
          <label for="modal-end-date">To date <span class="required-mark">*</span></label>
          <input type="date" id="modal-end-date" value="${end}" required ${disabled ? 'disabled' : ''} />
        </div>
      </div>
      ${err}
    </div>
  `;
}

function useCasePickerHtml(currentUseCases, draft = {}) {
  const catalog = USE_CASE_LIBRARY.filter(
    (d) => d.stage === scoringTab && !currentUseCases.some((u) => u.id === d.id)
  );
  const enabled = catalog.filter((d) => isTenantEnabledUseCase(d));
  const locked = catalog.filter((d) => !isTenantEnabledUseCase(d));
  const selected = draft.id ? USE_CASE_LIBRARY.find((d) => d.id === Number(draft.id)) : null;
  const selectedEnabled = selected ? isTenantEnabledUseCase(selected) : null;

  const optionBtn = (d) => {
    const enabledUc = isTenantEnabledUseCase(d);
    const selectedCls = Number(draft.id) === d.id ? 'is-selected' : '';
    return `
      <button type="button"
        class="uc-picker-option ${enabledUc ? 'is-enabled' : 'is-locked'} ${selectedCls}"
        data-pick-uc="${d.id}">
        <span class="uc-status-dot" aria-hidden="true"></span>
        <span class="uc-picker-option-text">
          <span class="uc-picker-code">${checkCode(d.id)}</span>
          <span class="uc-picker-name">${d.name}</span>
        </span>
        <span class="uc-picker-badge">${enabledUc ? 'Available' : 'Not enabled'}</span>
      </button>
    `;
  };

  const triggerLabel = selected ? `${checkCode(selected.id)} — ${selected.name}` : 'Select use-case…';

  return `
    <div class="field">
      <label>Use-case</label>
      <div class="uc-picker ${ucPickerOpen ? 'is-open' : ''}">
        <button type="button" class="uc-picker-trigger ${selected ? (selectedEnabled ? 'is-enabled' : 'is-locked') : ''}" data-action="toggle-uc-picker" aria-expanded="${ucPickerOpen ? 'true' : 'false'}">
          <span class="uc-status-dot" aria-hidden="true"></span>
          <span class="uc-picker-trigger-label">${triggerLabel}</span>
          <span class="uc-picker-caret" aria-hidden="true">▾</span>
        </button>
        ${
          ucPickerOpen
            ? `
          <div class="uc-picker-menu" role="listbox">
            <div class="uc-picker-legend">
              <span><span class="uc-status-dot is-enabled"></span> Available (enabled)</span>
              <span><span class="uc-status-dot is-locked"></span> Not enabled</span>
            </div>
            ${
              enabled.length
                ? `<div class="uc-picker-group-label">Available</div>${enabled.map(optionBtn).join('')}`
                : `<div class="uc-picker-empty">No available use-cases left to add.</div>`
            }
            ${
              locked.length
                ? `<div class="uc-picker-group-label">Not enabled for your organisation</div>${locked.map(optionBtn).join('')}`
                : ''
            }
            ${!enabled.length && !locked.length ? `<div class="uc-picker-empty">All catalog use-cases are already configured.</div>` : ''}
          </div>
        `
            : ''
        }
      </div>
    </div>
  `;
}

function renderConfig(root, session) {
  if (!canAccess(session.role, 'config')) {
    location.hash = '#/queue';
    return;
  }

  const store = getConfigStore();
  const current = getCurrentConfigVersion(store);
  const view = getViewVersion() || current;
  const readOnly = isReadOnly();
  const previous = store.versions
    .filter((v) => v.id !== store.currentId)
    .sort((a, b) => b.number - a.number);
  const rows = filteredRows(view.useCases);
  const weightedRows = rows.filter((u) => !isCriticalUseCase(u));
  const weightTotal = weightedRows.reduce((sum, u) => sum + (Number(u.weight) || 0), 0);
  const weightFooterOk = weightedRows.length === 0 || weightTotal === 100;
  const passPct = Number(view.stagePassPct?.[scoringTab] ?? DEFAULT_STAGE_PASS[scoringTab] ?? 70);
  const tabLabel = stageName(scoringTab);

  const weightBar = Math.max(0, Math.min(100, weightTotal));
  const content = `
    <div class="cfg-page">
      <div class="cfg-hero">
        <div class="cfg-hero-copy">
          <p class="cfg-kicker">Scoring rules</p>
          <h1>Configuration</h1>
          <p>Set the pass mark, critical gates, and weightage for each claim stage. Changes publish as a dated version.</p>
        </div>
        <div class="cfg-hero-actions">
          <div class="current-version-pill">
            ${formatVersionLabel(readOnly ? view : current, { isCurrent: !readOnly })}
            ${readOnly ? '<span class="readonly-tag">Read-only</span>' : ''}
            ${isFutureVersion(view) ? '<span class="readonly-tag">Scheduled</span>' : ''}
          </div>
          <div class="prev-versions-wrap">
            <button type="button" class="btn btn-secondary prev-versions-btn" data-action="toggle-prev">
              ${iconHistory()}
              Versions
            </button>
            ${
              prevVersionsOpen
                ? `
              <div class="prev-versions-menu">
                ${
                  previous.length === 0
                    ? `<div class="prev-empty">No previous versions yet.</div>`
                    : previous
                        .map(
                          (v) => `
                      <button type="button" class="prev-version-item" data-view-version="${v.id}">
                        ${formatVersionLabel(v)}
                      </button>
                    `
                        )
                        .join('')
                }
              </div>
            `
                : ''
            }
          </div>
          ${
            readOnly
              ? `<button type="button" class="btn btn-secondary" data-action="back-current">Back to current</button>`
              : `<button type="button" class="btn btn-primary" data-action="add-uc">Add use-case</button>`
          }
        </div>
      </div>
      ${feedback ? `<div class="save-feedback ${feedback.type}">${feedback.message}</div>` : ''}

      <div class="cd-stepper cfg-stepper" role="tablist" aria-label="Scoring stages">
        ${SCORING_TABS.map(
          (tab) => `
          <button type="button" class="cd-step ${scoringTab === tab.id ? 'is-active' : ''}" data-scoring-tab="${tab.id}" role="tab" aria-selected="${scoringTab === tab.id ? 'true' : 'false'}">
            ${tab.label}
          </button>`
        ).join('')}
      </div>

      <section class="cfg-board">
        <div class="cfg-board-head">
          <div>
            <h2>${tabLabel} use-cases</h2>
            <p>Critical checks are pass / fail only. Remaining checks share 100% weightage. A failed critical holds the claim on this stage.</p>
          </div>
          <div class="cfg-pass-inline">
            <label for="stage-pass-pct">Pass mark</label>
            <div class="config-pass-input">
              <input type="number" id="stage-pass-pct" min="0" max="100" step="1" value="${passPct}" data-original="${passPct}" ${readOnly ? 'disabled' : ''} />
              <span>%</span>
            </div>
            ${
              readOnly
                ? ''
                : `<button type="button" class="btn btn-secondary" data-action="save-pass" disabled>Save</button>`
            }
          </div>
        </div>

        <div class="cfg-board-toolbar">
          <label class="listing-search">
            <span class="listing-search-icon">${iconSearch()}</span>
            <input type="search" id="uc-search" placeholder="Search ${tabLabel} use-cases…" value="${filters.query.replace(/"/g, '&quot;')}" />
          </label>
          <label class="cfg-category">
            <span>Category</span>
            <select id="filter-category">
              <option value="all">All categories</option>
              ${RISK_CATEGORIES.map((c) => `<option value="${c.id}" ${filters.riskCategory === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
          </label>
        </div>

        <div class="config-table-wrap">
          <table class="config-table">
            <thead>
              <tr>
                <th class="col-menu"></th>
                <th>Use-case</th>
                <th>Name</th>
                <th>Description</th>
                <th>Category</th>
                <th>Weightage</th>
              </tr>
            </thead>
            <tbody>
              ${
                rows.length === 0
                  ? `<tr><td colspan="6" class="empty-cell">No use-cases in ${tabLabel} yet. Add one to start scoring this stage.</td></tr>`
                  : rows
                      .map((u) => {
                        const catClass = `cat-${u.riskCategory}`;
                        return `
                  <tr>
                    <td class="col-menu">
                      ${
                        readOnly
                          ? ''
                          : `
                        <div class="row-menu-wrap">
                          <button type="button" class="row-menu-btn" data-menu="${u.id}" aria-label="Actions">${iconDots()}</button>
                          ${
                            openMenuId === u.id
                              ? `
                            <div class="row-menu">
                              <button type="button" data-edit="${u.id}">Edit category / weightage</button>
                              <button type="button" class="danger" data-delete="${u.id}">Delete use-case</button>
                            </div>
                          `
                              : ''
                          }
                        </div>
                      `
                      }
                    </td>
                    <td><span class="check-code">${u.code}</span></td>
                    <td class="uc-name">${u.name}</td>
                    <td class="uc-desc">${u.description || '—'}</td>
                    <td><span class="cat-pill ${catClass}">${categoryLabel(u.riskCategory)}</span></td>
                    <td class="uc-weight">${isCriticalUseCase(u) ? 'Pass / fail' : `${u.weight ?? 0}%`}</td>
                  </tr>
                `;
                      })
                      .join('')
              }
            </tbody>
          </table>
        </div>
        <div class="config-weight-footer ${weightFooterOk ? 'is-ok' : 'is-warn'}">
          <div class="cfg-weight-copy">
            <span>Stage weightage</span>
            <strong>${weightedRows.length === 0 ? '—' : `${weightTotal}% / 100%`}</strong>
            <small>${
              weightedRows.length === 0
                ? 'Critical use-cases have no weight. This stage is pass / fail on critical checks only.'
                : weightTotal === 100
                  ? 'Non-critical weights add up to 100%.'
                  : 'Non-critical use-cases in this stage should add to 100%.'
            }</small>
          </div>
          ${
            weightedRows.length
              ? `<div class="cfg-weight-track" aria-hidden="true"><span style="width:${weightBar}%"></span></div>`
              : ''
          }
        </div>
      </section>
    </div>

    ${renderModalHtml(view.useCases)}
  `;

  root.innerHTML = renderShell(session, '#/config', content, { mainClass: 'is-dashboard' });
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];
  bindConfigEvents(root, session, view.useCases);
}

function renderModalHtml(currentUseCases) {
  if (!modal) return '';

  const draft = modal.draft || defaultVersionDates();
  const step = modal.step || 'form';

  if (step === 'version-dates') {
    const summary =
      modal.type === 'delete'
        ? `Delete use-case from configuration`
        : modal.type === 'add'
          ? `Add ${draft.code || ''} ${draft.name || 'use-case'}`
          : modal.type === 'pass'
            ? `Set ${stageName(scoringTab)} pass mark to ${draft.passPct}%`
              : `Update ${draft.code || ''} ${draft.name || 'use-case'}`;
    return modalFrame(
      'config-modal-title',
      'Save as a new version',
      `
          ${versionNoticeHtml()}
          <p class="modal-copy"><strong>Change:</strong> ${summary}</p>
          ${versionDateFieldsHtml(draft)}
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-action="back-form-step">Back</button>
            <button type="button" class="btn btn-primary" data-action="confirm-version" ${hasCompleteVersionDates(draft) ? '' : 'disabled'}>
              Create version
            </button>
          </div>
      `
    );
  }

  if (modal.type === 'delete') {
    const uc = currentUseCases.find((u) => u.id === modal.useCaseId);
    return modalFrame(
      'config-modal-title',
      'Remove scoring check?',
      `
          <div class="version-notice" role="status">Your changes will be saved as a new version.</div>
          <p class="modal-copy">Remove <strong>${uc?.code} ${uc?.name}</strong> from the scoring configuration? You will set the new version’s start and end dates next.</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-danger" data-action="continue-version-dates">Continue</button>
          </div>
      `
    );
  }

  if (modal.type === 'pass') {
    return modalFrame(
      'config-modal-title',
      'Save stage pass threshold',
      `
          <div class="version-notice" role="status">Your changes will be saved as a new version.</div>
          <p class="modal-copy">${stageName(scoringTab)} will pass at ${draft.passPct}%.</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-primary" data-action="continue-version-dates">Continue</button>
          </div>
      `
    );
  }

  const isAdd = modal.type === 'add';
  const selectedDef = draft.id ? USE_CASE_LIBRARY.find((d) => d.id === Number(draft.id)) : null;
  const selectedEnabled = selectedDef ? isTenantEnabledUseCase(selectedDef) : false;
  const isLockedSelection = isAdd && selectedDef && !selectedEnabled;
  const draftCritical = (draft.riskCategory || selectedDef?.riskCategory) === 'critical';

  let primaryLabel = 'Continue';
  let primaryAction = 'continue-version-dates';
  let primaryDisabled = false;
  let primaryClass = 'btn btn-primary';

  if (isAdd) {
    if (!selectedDef) {
      primaryLabel = 'Add use-case';
      primaryAction = 'confirm-version';
      primaryDisabled = true;
    } else if (isLockedSelection) {
      primaryLabel = 'Raise a request';
      primaryAction = 'raise-request';
      primaryClass = 'btn btn-primary btn-request';
    } else {
      primaryLabel = 'Add use-case';
      primaryAction = 'confirm-version';
      primaryDisabled = !hasCompleteVersionDates(draft);
    }
  }

  return modalFrame(
    'config-modal-title',
    isAdd ? 'Add scoring check' : 'Edit scoring check',
    `
        ${
          isLockedSelection
            ? `<p class="modal-copy">This scoring check is not enabled for your organisation. Raise a request to Azentio to enable it.</p>`
            : `<div class="version-notice" role="status">Your changes will be saved as a new version.</div>
               <p class="modal-copy">${isAdd ? 'Select an available (green) use-case. From and to dates unlock after you choose one, then add the use-case.' : 'Update category or weightage.'}</p>`
        }

        ${
          isAdd
            ? useCasePickerHtml(currentUseCases, draft)
            : `
        <div class="field">
          <label>Scoring check</label>
          <div class="value-readonly"><span class="check-code">${draft.code}</span> ${draft.name}</div>
        </div>`
        }

        <div class="field">
          <label>Description</label>
          <textarea id="modal-desc" rows="3" readonly>${(draft.description || selectedDef?.description || '').replace(/</g, '&lt;')}</textarea>
        </div>

        ${
          isLockedSelection
            ? ''
            : `
        <div class="field-row">
          <div class="field">
            <label>Stage</label>
            <select id="modal-stage" ${isAdd && !selectedDef ? 'disabled' : ''}>
              ${CLAIM_STAGES.map((s) => `<option value="${s.id}" ${(draft.stage || selectedDef?.stage || scoringTab) === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Category</label>
            <select id="modal-category" ${isAdd && !selectedDef ? 'disabled' : ''}>
              ${RISK_CATEGORIES.map((c) => `<option value="${c.id}" ${(draft.riskCategory || selectedDef?.riskCategory || 'high') === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Weightage %</label>
            ${
              draftCritical
                ? `<div class="value-readonly">Pass / fail — no weightage</div>`
                : `<input type="number" id="modal-weight" min="0" max="100" step="1"
              value="${draft.weight ?? selectedDef?.weight ?? 0}"
              ${isAdd && !selectedDef ? 'disabled' : ''} />`
            }
          </div>
        </div>
        `
        }

        ${isAdd && !isLockedSelection ? versionDateFieldsHtml(draft, { disabled: !selectedEnabled }) : ''}

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
          <button type="button" class="${primaryClass}" data-action="${primaryAction}" ${primaryDisabled ? 'disabled' : ''}>${primaryLabel}</button>
        </div>
    `
  );
}

function bindConfigEvents(root, session, currentUseCases) {
  const rerender = () => renderConfig(root, session);

  root.querySelectorAll('[data-scoring-tab]').forEach((btn) => {
    btn.addEventListener('click', () => {
      scoringTab = btn.dataset.scoringTab;
      openMenuId = null;
      filters.query = '';
      rerender();
    });
  });

  root.querySelector('#uc-search')?.addEventListener('input', (e) => {
    filters.query = e.target.value;
    rerender();
  });
  root.querySelector('#filter-category')?.addEventListener('change', (e) => {
    filters.riskCategory = e.target.value;
    rerender();
  });

  root.querySelector('[data-action="toggle-prev"]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    prevVersionsOpen = !prevVersionsOpen;
    openMenuId = null;
    rerender();
  });

  root.querySelectorAll('[data-view-version]').forEach((btn) => {
    btn.addEventListener('click', () => {
      viewingVersionId = Number(btn.dataset.viewVersion);
      prevVersionsOpen = false;
      feedback = null;
      rerender();
    });
  });

  root.querySelector('[data-action="back-current"]')?.addEventListener('click', () => {
    viewingVersionId = null;
    feedback = null;
    rerender();
  });

  root.querySelector('[data-action="add-uc"]')?.addEventListener('click', () => {
    openMenuId = null;
    ucPickerOpen = false;
    modal = {
      type: 'add',
      step: 'form',
      draft: { riskCategory: 'high', weight: 0, stage: scoringTab, ...defaultVersionDates() },
    };
    rerender();
  });

  const passInput = root.querySelector('#stage-pass-pct');
  const savePass = root.querySelector('[data-action="save-pass"]');
  const syncPassSave = () => {
    if (!savePass || !passInput) return;
    const raw = Number(passInput.value);
    const original = Number(passInput.dataset.original);
    savePass.disabled = !Number.isFinite(raw) || Math.round(raw) === original;
  };
  passInput?.addEventListener('input', syncPassSave);
  passInput?.addEventListener('change', syncPassSave);

  root.querySelector('[data-action="save-pass"]')?.addEventListener('click', () => {
    const raw = Number(root.querySelector('#stage-pass-pct')?.value);
    if (!Number.isFinite(raw) || raw < 0 || raw > 100) {
      feedback = { type: 'error', message: 'Enter a pass mark between 0 and 100.' };
      rerender();
      return;
    }
    modal = {
      type: 'pass',
      step: 'form',
      draft: { passPct: Math.round(raw), ...defaultVersionDates() },
    };
    rerender();
  });

  root.querySelectorAll('[data-menu]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.menu);
      openMenuId = openMenuId === id ? null : id;
      prevVersionsOpen = false;
      rerender();
    });
  });

  root.querySelectorAll('[data-edit]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.edit);
      const uc = currentUseCases.find((u) => u.id === id);
      openMenuId = null;
      ucPickerOpen = false;
      modal = { type: 'edit', step: 'form', useCaseId: id, draft: { ...uc, ...defaultVersionDates() } };
      rerender();
    });
  });

  root.querySelectorAll('[data-delete]').forEach((btn) => {
    btn.addEventListener('click', () => {
      openMenuId = null;
      ucPickerOpen = false;
      modal = {
        type: 'delete',
        step: 'form',
        useCaseId: Number(btn.dataset.delete),
        draft: defaultVersionDates(),
      };
      rerender();
    });
  });

  root.querySelectorAll('[data-action="close-modal"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      modal = null;
      ucPickerOpen = false;
      rerender();
    });
  });

  root.querySelector('[data-action="toggle-uc-picker"]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    ucPickerOpen = !ucPickerOpen;
    rerender();
  });

  root.querySelectorAll('[data-pick-uc]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.pickUc);
      const def = USE_CASE_LIBRARY.find((d) => d.id === id);
      if (!def) return;
      modal.draft = {
        ...(modal.draft || {}),
        id: def.id,
        code: checkCode(def.id),
        name: def.name,
        description: def.description,
        stage: def.stage || scoringTab,

function pctDelta(current, previous) {
  if (previous == null || previous === 0) {
    if (!current) return { dir: 'flat', text: 'No prior period' };
    return { dir: 'up', text: 'New vs last period' };
  }
  const d = ((current - previous) / previous) * 100;
  const dir = d > 0.4 ? 'up' : d < -0.4 ? 'down' : 'flat';
  const sign = d > 0 ? '+' : '';
  return { dir, text: `${sign}${d.toFixed(1)}% vs last period` };
}

function ptsDelta(current, previous) {
  if (previous == null) return { dir: 'flat', text: 'No prior period' };
  const delta = current - previous;
  const dir = delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat';
  const arrow = delta > 0 ? '▲' : delta < 0 ? '▼' : '•';
  return { dir, text: `${arrow} ${Math.abs(delta)} pt${Math.abs(delta) === 1 ? '' : 's'} vs last period` };
}

  if (user && user !== 'all') list = list.filter((r) => r.user === user);
  if (query) {
    const q = query.trim().toLowerCase();
    list = list.filter((r) => {
      const blob = `${r.claimId} ${r.fnolNumber} ${r.registrationNo} ${r.claimant || ''} ${r.user} ${r.action} ${r.field} ${r.delta || ''}`.toLowerCase();
      return blob.includes(q);
    });
  }
  list.sort((a, b) => `${b.date}T${b.time || '00:00'}`.localeCompare(`${a.date}T${a.time || '00:00'}`));
  const paged = paginate(list, page);

  const csvRows = [
    ['When', 'Actor', 'Action', 'Claim', 'FNOL', 'Type', 'Field', 'Old value', 'New value'],
    ...list.map((row) => [
      `${row.date} ${row.time || ''}`.trim(),
      row.user || '',
      row.userAction || row.action || '',
      row.claimId || '',
      row.fnolNumber || '',
      row.ledgerType || '',
      row.field || '',
      row.oldValue || '',
      row.newValue || '',
    ]),
  ];
  const pdfHtml = `
    <h1>Audit trail</h1>
    <p>${list.length} events · ${formatRangeLabel(range)}</p>
    <table>
      <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Claim</th><th>FNOL</th><th>Type</th><th>Change</th></tr></thead>
      <tbody>
        ${list
          .map(
            (row) =>
              `<tr><td>${formatDate(row.date)} ${esc(row.time || '')}</td><td>${esc(row.user || '—')}</td>
              <td>${esc(row.userAction || row.action || '—')}</td><td>${esc(row.claimId && row.claimId !== '—' ? row.claimId : 'Configuration')}</td>
              <td>${esc(row.fnolNumber && row.fnolNumber !== '—' ? row.fnolNumber : '—')}</td>
              <td>${esc(row.ledgerType)}</td><td>${esc(row.delta || '—')}</td></tr>`
          )
          .join('')}
      </tbody>
    </table>`;

  const content = `
    <div class="listing-page">
      <div class="listing-head">
        <div>
          <h1>Audit trail</h1>
          <p class="listing-count">${list.length} event${list.length === 1 ? '' : 's'} · ${formatRangeLabel(range)}</p>
        </div>
      </div>

      <div class="listing-toolbar audit-toolbar">
        <label class="listing-search">
          <span class="listing-search-icon">${iconSearch()}</span>
          <input id="audit-search" type="search" placeholder="Search by claimant name, claim #" value="${esc(query)}" autocomplete="off" />
        </label>
        <label class="listing-mini-select">
          <select id="audit-type" aria-label="Event type">
            ${AUDIT_EVENT_TYPES.map(
              (t) => `<option value="${t}" ${changeType === t ? 'selected' : ''}>${t === 'all' ? 'Event type (All)' : t}</option>`
            ).join('')}
          </select>
          ${iconCaretDown()}
        </label>
        <label class="listing-mini-select">
          <select id="audit-user" aria-label="Actor">
            <option value="all" ${user === 'all' ? 'selected' : ''}>Actor (All)</option>
            ${actors.map((name) => `<option value="${esc(name)}" ${user === name ? 'selected' : ''}>${esc(name)}</option>`).join('')}
          </select>
          ${iconCaretDown()}
        </label>
        <label class="listing-mini-select">
          <select id="audit-period" aria-label="Date range">
            ${DAY_RANGE_PRESETS.map(
              (p) => `<option value="${p.id}" ${period === p.id ? 'selected' : ''}>${p.label}</option>`
            ).join('')}
            <option value="custom" ${period === 'custom' ? 'selected' : ''}>Custom range</option>
          </select>
          ${iconCaretDown()}
        </label>
        ${
          period === 'custom'
            ? `<div class="listing-custom-dates audit-custom-dates">
            <label>From <input id="audit-from" type="date" value="${esc(from || range.from)}" /></label>
            <label>To <input id="audit-to" type="date" value="${esc(to || range.to)}" /></label>
          </div>`
            : ''
        }
        <div class="audit-toolbar-export">
          ${exportMenuHtml('audit', { disabled: !list.length })}
        </div>
      </div>

      ${
        list.length === 0
          ? `<div class="listing-card"><div class="chart-empty">No audit events in this filter.</div></div>`
          : `<div class="listing-card">
      <div class="listing-table-wrap">
      <table class="listing-table audit-table">
        <thead>
          <tr>
            <th>When</th>
            <th>Actor</th>
            <th>Action</th>
            <th>Claim</th>
            <th>FNOL</th>
            <th class="col-type">Type</th>
            <th>Change</th>
          </tr>
        </thead>
        <tbody>
          ${paged.slice
            .map(
              (row) => `
            <tr>
              <td class="mono">${formatDate(row.date)} ${esc(row.time || '')}</td>
              <td>${esc(row.user || '—')}</td>
              <td>${esc(row.userAction || row.action || '—')}</td>
              <td class="col-claim">${
                row.claimId && row.claimId !== '—'
                  ? `<a class="listing-link" href="#/claim/${esc(row.claimId)}">${esc(row.claimId)}</a>`
                  : 'Configuration'
              }</td>
              <td class="col-fnol">${
                row.claimId && row.claimId !== '—' && row.fnolNumber && row.fnolNumber !== '—'
                  ? `<a class="listing-link" href="#/claim/${esc(row.claimId)}">${esc(row.fnolNumber)}</a>`
                  : '—'
              }</td>
              <td class="col-type">${esc(row.ledgerType)}</td>
              <td>${esc(row.delta || '—')}</td>
            </tr>`
            )
            .join('')}
        </tbody>
      </table>
    </div>
    <div class="listing-footer">${pagerHtml(paged)}</div>
    </div>`
      }
    </div>
  `;

  root.innerHTML = renderShell(session, '#/audit', content, { mainClass: 'is-listing' });
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  const patch = (partial, { keepPage = false } = {}) => {
    const next = { ...state, ...partial };
    if (!keepPage && partial.page === undefined) next.page = 1;
    onChange(next);
  };
  root.querySelector('#audit-search')?.addEventListener('input', (e) => {
    keepAuditSearchFocus = true;
    patch({ query: e.target.value });
  });
  if (keepAuditSearchFocus) {
    keepAuditSearchFocus = false;
    const search = root.querySelector('#audit-search');
    if (search) {
      search.focus();
      const end = search.value.length;
      try {
        search.setSelectionRange(end, end);
      } catch {
        /* ignore */
      }
    }
  }

  root.querySelector('#audit-type')?.addEventListener('change', (e) => {
    patch({ changeType: e.target.value });
  });
  root.querySelector('#audit-user')?.addEventListener('change', (e) => {
    patch({ user: e.target.value });
  });
  root.querySelector('#audit-period')?.addEventListener('change', (e) => {
    const nextPeriod = e.target.value;
    const nextRange = resolvePeriodRange(nextPeriod, { from, to });
    patch({ period: nextPeriod, from: nextRange.from, to: nextRange.to });
  });
  root.querySelector('#audit-from')?.addEventListener('change', (e) => {
    patch({ from: e.target.value, period: 'custom' });
  });
  root.querySelector('#audit-to')?.addEventListener('change', (e) => {
    patch({ to: e.target.value, period: 'custom' });
  });
  root.querySelectorAll('[data-page]').forEach((btn) => {
    btn.addEventListener('click', () => patch({ page: Number(btn.getAttribute('data-page')) }, { keepPage: true }));
  });
  bindExportMenus(root, {
    audit: {
      csv: () => downloadCsv(`claim-intel-audit-${range.from}-to-${range.to}.csv`, csvRows),
      xls: () => downloadXls(`claim-intel-audit-${range.from}-to-${range.to}.xls`, csvRows),
      pdf: () => downloadPdf('Audit trail', pdfHtml),
    },
  });
}
  __ns.renderAudit = renderAudit;
})();

/* ===== js/app.js ===== */
(function () {
  const { renderLogin, renderQueue, renderClaimDetail, renderDashboard, destroyChart, renderConfig, renderReport, destroyReportCharts, renderAudit, getSession, clearSession, getWeights, scoreAllClaims, canAccess, homeRouteForRole } = __ns;
const root = document.getElementById('app');

/** @type {object} */
let queueState = {
  period: '365',
  from: '2025-08-12',
  to: '2026-08-11',
  stage: 'all',
  query: '',
  tier: 'all',
  sortKey: 'filed',
  sortDir: 'desc',
  garage: '',
  assignedTo: '',
  attention: '',
  branch: 'All branches',
  auditClaimId: null,
  versionKey: null,
  filtersOpen: false,
  draftFilters: null,
  page: 1,
  pageSize: 10,
};

/** @type {{ period: string, branch: string, chartMode: 'share'|'volume', claimType: string }} */
let dashState = { period: '30', branch: 'All branches', chartMode: 'share', claimType: 'all', query: '' };

/** @type {object} */
let reportState = {
  period: '90',
  branch: 'All branches',
  claimType: 'all',
  stage: 'all',
  from: '2026-05-14',
  to: '2026-08-11',
  ucStage: 'all',
  ucHardFailOnly: false,
  ucCompare: 'prior',
  txPeriod: 'inherit',
  txFrom: '2026-05-14',
  txTo: '2026-08-11',
  txChangeType: 'all',
  txUser: 'all',
  versionKey: null,
  historyClaimId: null,
  versionQuery: '',
  versionPage: 1,
  rankingPage: 1,
};

let auditState = {
  period: '90',
  from: '2026-05-14',
  to: '2026-08-11',
  changeType: 'all',
  user: 'all',
  query: '',
  page: 1,
  filtersOpen: false,
  draftFilters: null,
};

let claimFilter = 'all';
let claimStageTab = null;
let claimPageTab = 'overview';
let claimVersionKey = null;
let claimExceptionPanel = null;
let claimExceptionNotice = null;
let lastClaimId = null;
let weights = getWeights();
let weightDraft = { ...weights };
let configFeedback = null;

function parseRoute() {
  const hash = location.hash || '#/login';
  const raw = hash.replace(/^#/, '') || '/login';
  const [pathPart, queryString] = raw.split('?');
  const parts = (pathPart || '/login').split('/').filter(Boolean);
  const params = new URLSearchParams(queryString || '');
  return { parts, path: pathPart, params };
}

function applyQueueLaunch(params) {
  if (![...params.keys()].length) return false;
  queueState = {
    ...queueState,
    tier: params.get('tier') || 'all',
    stage: params.get('stage') || queueState.stage,
    query: params.get('q') || '',
    branch: params.get('branch') || 'All branches',
    garage: params.get('garage') || '',
    assignedTo: params.get('assignedTo') || '',
    attention: params.get('attention') || '',
    period: params.get('period') || queueState.period,
    filtersOpen: false,
    draftFilters: null,
    page: 1,
  };
  return true;
}

function bindGlobalActions() {
  root.querySelectorAll('[data-action="logout"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      clearSession();
      destroyChart();
      destroyReportCharts();
      location.hash = '#/login';
      render();
    });
  });
  root.querySelectorAll('[data-action="toggle-profile"]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wrap = btn.closest('.persona-wrap');
      const menu = wrap?.querySelector('.persona-menu');
      if (!menu) return;
      const willOpen = menu.hidden;
      root.querySelectorAll('.persona-menu').forEach((m) => {
        m.hidden = true;
      });
      root.querySelectorAll('.persona-wrap').forEach((w) => w.classList.remove('is-open'));
      menu.hidden = !willOpen;
      wrap.classList.toggle('is-open', willOpen);
      btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });
  });
  document.addEventListener(
    'click',
    () => {
      root.querySelectorAll('.persona-menu').forEach((m) => {
        m.hidden = true;
      });
      root.querySelectorAll('.persona-wrap').forEach((w) => w.classList.remove('is-open'));
    },
    { once: true }
  );
}

function render() {
  const session = getSession();
  const { parts, params } = parseRoute();
  const route = parts[0] || 'login';

  if (!session && route !== 'login') {
    sessionStorage.setItem('claim-intel-next', location.hash);
    renderLogin(root);
    return;
  }

  if (session && route === 'login') {
    location.hash = homeRouteForRole(session.role);
    return;
  }

  if (route === 'login') {
    destroyChart();
    destroyReportCharts();
    renderLogin(root);
    return;
  }

  const claims = scoreAllClaims(weights);

  if (route === 'queue') {
    destroyChart();
    destroyReportCharts();
    if (applyQueueLaunch(params)) {
      history.replaceState(null, '', `${location.pathname}${location.search}#/queue`);
    }
    renderQueue(root, session, claims, queueState, (next) => {
      queueState = next;
      render();
    });
  } else if (route === 'claim') {
    destroyChart();
    destroyReportCharts();
    const id = parts.slice(1).join('/');
    if (id !== lastClaimId) {
      lastClaimId = id;
      claimFilter = 'all';
      claimStageTab = session.role === 'surveyor' ? 'assessment' : null;
      claimPageTab = 'overview';
      claimVersionKey = null;
      claimExceptionPanel = null;
      claimExceptionNotice = null;
    }
    const claim = claims.find((c) => c.id === id);
    renderClaimDetail(
      root,
      session,
      claim,
      claimFilter,
      (f, opts = {}) => {
        claimFilter = f === 'cant_evaluate' ? 'fail' : f;
        if (opts.selectedStage !== undefined) claimStageTab = opts.selectedStage;
        if (opts.pageTab !== undefined) claimPageTab = opts.pageTab;
        if (opts.versionKey !== undefined) claimVersionKey = opts.versionKey;
        if (opts.exceptionPanel !== undefined) claimExceptionPanel = opts.exceptionPanel;
        if (opts.exceptionNotice !== undefined) claimExceptionNotice = opts.exceptionNotice;
        render();
      },
      {
        selectedStage: claimStageTab,
        pageTab: claimPageTab,
        versionKey: claimVersionKey,
        exceptionPanel: claimExceptionPanel,
        exceptionNotice: claimExceptionNotice,
      }
    );
  } else if (route === 'dashboard') {
    destroyReportCharts();
    if (!canAccess(session.role, 'dashboard')) {
      location.hash = '#/queue';
      return;
    }
    renderDashboard(root, session, claims, dashState, (next) => {
      dashState = next;
      render();
    });
  } else if (route === 'report') {
    destroyChart();
    if (!canAccess(session.role, 'report')) {
      location.hash = '#/queue';
      return;
    }
    renderReport(root, session, claims, reportState, (next) => {
      reportState = next;
      render();
    });
  } else if (route === 'audit') {
    destroyChart();
    destroyReportCharts();
    if (!canAccess(session.role, 'audit')) {
      location.hash = '#/queue';
      return;
    }
    renderAudit(root, session, claims, auditState, (next) => {
      auditState = next;
      render();
    });
  } else if (route === 'config') {
    destroyChart();
    destroyReportCharts();
    if (!canAccess(session.role, 'config')) {
      location.hash = '#/queue';
      return;
    }
    renderConfig(root, session);
    // Refresh weights from config store after config interactions
    weights = getWeights();
    weightDraft = { ...weights };
  } else {
    location.hash = session ? homeRouteForRole(session.role) : '#/login';
    return;
  }

  bindGlobalActions();
}

window.addEventListener('hashchange', () => {
  const { parts } = parseRoute();
  if (parts[0] !== 'claim') {
    claimFilter = 'all';
    claimStageTab = null;
    claimPageTab = 'overview';
    claimVersionKey = null;
    claimExceptionPanel = null;
    claimExceptionNotice = null;
    lastClaimId = null;
  }
  render();
});

if (!location.hash) {
  const session = getSession();
  location.hash = session ? homeRouteForRole(session.role) : '#/login';
} else {
  render();
}

window.addEventListener('load', render);
})();

})();

  </script>
</body>
</html>
